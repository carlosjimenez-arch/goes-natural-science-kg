id: '0001'
title: Use a versioned curriculum catalog with explicit requirement groups and derived plans
status: proposed
date: '2026-09-14'
supersedes: null
invariants:
- 1
- 2
- 3
- 5
- 8
context: The curriculum sources mix annual targets, grade-band endpoints, parallel dimensions and achievement
  evidence. They do not supply a common causal prerequisite graph. The repository contract currently presupposes
  a DAG and grade-bearing capability identifiers. This research questions those assumptions without changing
  the contract or implementing production code. See findings.yaml for claim-level source URLs, retrieval
  dates, limitations and the comparison matrix.
options:
- name: Prerequisite DAG
  pros:
  - Simple precedence and downstream-impact checks.
  - Can encode conjunctive predecessors with explicit semantics.
  cons:
  - Alternative requirement groups and co-teaching need extensions.
  - No learning-effect estimate or time optimization by itself.
- name: Directed hypergraph
  pros:
  - Expresses conjunctions and alternative requirement sets directly.
  cons:
  - Does not supply teacher usability, timing semantics or empirical validity by itself.
- name: Probabilistic prerequisite network
  pros:
  - Can represent uncertainty and support adaptive decisions after calibration.
  cons:
  - BKT, POKS and learning progressions are different model families.
  - Response dependencies are not causal curriculum prerequisites.
  - Requires data and revalidation after changes.
- name: Q-matrix and cognitive diagnostic models
  pros:
  - Explicit assessment-to-attribute mapping; conjunctive and disjunctive item response models.
  cons:
  - Does not describe temporal prerequisites or a complete curriculum planner.
  - Mapping and parameter changes can require recalibration.
- name: Hierarchy-only ontology
  pros:
  - Familiar curriculum outline with low initial modeling burden.
  cons:
  - Cannot explain lateral prerequisite consequences or alternate routes without leaving the hierarchy-only
    model.
- name: Versioned catalog + requirement groups + activity scheduler + optional diagnostic layer
  pros:
  - Preserves source structures while representing AND/OR, co-teaching and separate evidence.
  - Supports explainable grade-move feasibility analysis and stable identity.
  cons:
  - More entity and validation types than a plain DAG.
  - Teacher auditability and maintenance advantage remain hypotheses requiring a pilot.
criteria:
- Co-requisites and AND/OR dependence semantics
- Sequencing under explicit time constraints
- Auditability by a nontechnical teacher
- Maintenance when the curriculum changes
- Explainable consequences of moving a grade 4 capability to grade 3
decision: Recommend the hybrid catalog and rule representation. Use alternatives of conjunctive prerequisite
  groups, not ungrouped AND/OR edge labels. Store co-teaching as activity/bundle or timing constraints.
  Derive a strict-precedence DAG for a selected plan and use a separate time-constrained activity scheduler.
  Keep assessment Q-mappings separate; defer probabilistic learner models until local data permit calibration.
  A flat graph is not the best source of truth. This is a proposed conceptual choice, not approval of
  a database, solver library or production schema.
consequences:
- Represent source statements, capabilities, grade placements, requirement groups, activities and assessment
  evidence as distinct versioned entities.
- Retain source-native units and parallel dimensions; cross-framework alignments are reviewed mappings
  rather than asserted equivalences.
- Do not treat appears_before as scientifically_required. Record evidence and scope for every proposed
  prerequisite.
- Preserve stable capability identities when grades change. A source-code/grade identifier can remain
  an external or placement identifier.
- Choose requirement routes before applying strict-precedence cycle checks. Other relationship types are
  not automatically subject to that check.
- Count activity minutes once, including setup, assessment and review; maintain the 9600-minute cap per
  grade and parameterize session duration.
- Report grade-move feasibility separately from developmental suitability and causal learning effects.
- Keep prerequisite confidence, learner mastery probability and causal-effect uncertainty separate. Do
  not invent probabilistic weights.
- Pilot the proposed reasoning rubric and teacher rule-review workflow before treating them as validated
  acceptance thresholds.
- The current CLAUDE.md grade-bearing IDs, endpoint-only edge hashes and blanket graph constraints need
  a later explicit contract decision before implementation. No silent override is made here.
- PISA 2018 and the retrieved PISA 2025 draft vocabulary must be versioned rather than silently replacing
  the contract competency enum.
- No production code, infrastructure deployment, corpus ingestion, fitted model or implementation tests
  are delivered in Phase 1.
