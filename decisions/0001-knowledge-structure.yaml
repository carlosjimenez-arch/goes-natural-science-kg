profile_tradeoffs:
  curriculum_designer: Preserve coherent phenomena, integrated tasks and curricular source distinctions;
    do not atomize everything to force a graph.
  graph_theory_researcher: Use explicit logical groups and acyclic strict precedence for chosen plans;
    do not confuse a taxonomy, an observation network and a causal prerequisite system.
  ai_software_engineer: Prefer versioned auditable tables/rules and deterministic derived artifacts; introduce
    probabilistic fitting only when its data and validation can be reproduced.
contract_changes_proposed_not_applied:
- location: CLAUDE.md section 3.2 identifiers
  change: Separate stable capability identity from grade-bearing placement/source identity.
- location: CLAUDE.md section 3.2 edge vocabulary and edge IDs
  change: Add identity and membership semantics for requirement groups; a hash of source, kind and target
    alone cannot distinguish multiple rule groups.
- location: CLAUDE.md Invariant 3 graph constraints
  change: Clarify which selected strict-precedence projection must be acyclic and grade-monotone; preserve
    validation of all required dependencies in that selected plan.
- location: CLAUDE.md section 3.2 cognitive fields
  change: Version framework competencies, preserving the 2018/draft-2025 distinction.
future_acceptance_checks:
- Reject ambiguous or empty requirement groups; demonstrate distinct AND and OR truth conditions on bounded
  examples.
- Show that the alternative-route cycle counterexample has a valid selected plan while a mandatory cycle
  is rejected.
- Explain a 4→3 move with violated rules, feasible alternatives, bundle effects, capacity and source-alignment
  changes.
- Verify stable identity under placement changes and lineage under genuine capability splits/merges.
- Verify shared activities are counted once and required coverage cannot silently disappear to fit a budget.
- Have teachers independently review rules and task rubrics; report disagreement before setting usability
  or reliability acceptance cutoffs.
- Validate optional student models on held-out local responses with calibration and drift checks before
  their use in placement.
implementation_status: Research proposal only; the repository has no production decision schema or implementation
  test suite yet.
