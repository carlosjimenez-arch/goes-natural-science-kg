criteria:
- Apply the predeclared eligibility and lexicographic rules in decision 0006.
- Require human review before production promotion.
decision: 'Provisional empirical choices: age_appropriateness_judge=few_shot; cognitive_judge=cot;
  curricular_judge=few_shot; curricularization=few_shot; decomposition=None; evidence_judge=few_shot;
  graph_judge=cot_few_shot. Production choices: none pending human review.'
consequences:
- No experimental variant is automatically routed into the production hierarchy.
- A role with no eligible variant remains unselected and needs investigation of reference
  labels, evidence or prompt behavior.
- The same held-out cases must not be used for repeated tuning followed by an unqualified
  generalization claim.
- Full metrics and the reasons for each rejected variant are in data/processed/prompt-evaluation/report.json.
