    - https://docs.langchain.com/oss/python/langgraph/use-graph-api
    - https://docs.langchain.com/oss/python/langgraph/persistence
    - https://pirls.bc.edu/timss2023/frameworks/pdf/T23_Frameworks_Ch2_Science.pdf
    - https://www.nextgenscience.org/sites/default/files/resource/files/AppendixE-ProgressionswithinNGSS-061617.pdf
  retrieved_at: 2026-09-14
implementation_status: Implemented; empirical prompt quality requires a broader educational evaluation set.
