profile_tradeoffs:
  curriculum_designer: Two teachers can name the same lesson differently and still teach the
    same sequence; a score that punishes wording as if it were a pedagogical error will keep
    rejecting usable material and will mislead the review panel about where the problem is.
  graph_theory_researcher: Precision and recall over a labelled edge set are only defined
    once the vertex correspondence is fixed. Computing them through a sentinel for unmatched
    vertices measures the matching, not the edges, and the two must be reported separately.
  ai_software_engineer: Re-reading recorded responses is free, reproducible and leaves the
    published experiment untouched, so a metric change never invalidates a measured result.
implementation_status: Implemented and measured on 2026-09-17 over the 210 recorded follow-up
  cells; no provider request was made and no prompt or model is promoted.
