- tests/unit/test_sequencing.py::test_explicit_bridge_resumes_next_grade
- tests/unit/test_sequencing.py::test_corequisites_need_joint_authored_teaching
- tests/unit/test_sequencing.py::test_context_caps_and_abstract_units
- tests/unit/test_sequencing.py::test_failed_build_archives_previous_calendars
- tests/unit/test_sequencing.py::test_provisional_graph_keeps_chunk_evidence
- tests/unit/test_sequencing.py::test_objective_weights_are_applied_explicitly
