- tests/integration/test_proposal_snapshot.py::test_real_proposal_has_audited_calendars_and_retains_rejected_draft
- tests/integration/test_proposal_snapshot.py::test_warm_start_is_finite_topological_and_deterministic
- tests/integration/test_proposal_snapshot.py::test_context_seed_uses_authored_alternatives_and_obeys_caps
evidence:
  findings: Primary textbook catalog and existing reviewer experiments; policy choices
    are engineering/pedagogical hypotheses, not validated cut points.
  claim_ids: []
  source_url:
  - https://www.mined.gob.sv/ciencia-educativa/
  retrieved_at: '2026-09-17'
implementation_status: Implemented with live Vertex generation and bounded review,
  first rejected aggregate, an intermediate feasible calendar, and a final proposed
  calendar. Human validation and production prompt promotion remain pending.
