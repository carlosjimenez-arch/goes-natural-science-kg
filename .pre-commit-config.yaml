repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --locked --no-sync ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: uv run --locked --no-sync ruff format --check
        language: system
        types: [python]
      - id: contracts
        name: frozen contracts and repository hygiene
        entry: uv run --locked --no-sync pytest tests/unit/test_repository.py --benchmark-disable
        language: system
        pass_filenames: false
        always_run: true
