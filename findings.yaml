      - id: assistments-teacher-survey-links
        topic: evidence_reliability
        claim: In ASSISTments, a data-driven regression over 24 expert-defined prerequisite links found
          only 25-36% clearly supported, while a survey of 21 teachers rated 67% good and 33% bad, showing
          both that expert maps contain problematic links and that teachers can meaningfully audit link-level
          claims.
        detail: Adjei's WPI dissertation (2018, extending Adjei, Botelho & Heffernan LAK 2016) selected
          24 links with at least 50 students and found that prerequisite mastery speed significantly predicted
          post-requisite performance in 6 links (25%) regardless of transformation and 8 links (36%) under
          two transformations. A 7-point teacher survey (21 of 45 respondents) judged 16 links good and
          8 bad. The LAK 2016 abstract reports the survey 'largely confirm our findings in the data-driven
          approach'. Teachers were able to reason about pairwise prerequisite strength from plain statements,
          which is evidence for the auditability of typed edges over probability tables.
        quote: the survey found 67% of the links (16 links) are good, while the remaining 33% (8 links)
          are bad.
        source_title: Refining Prerequisite Skill Structure Graphs Using Randomized Controlled Trials,
