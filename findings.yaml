      - id: pisa-knowledge-types
        framework: pisa
        topic: knowledge-types
        claim: 'PISA 2025 distinguishes three knowledge types: content, procedural and epistemic knowledge.'
        detail: 'Table 1 defines Knowledge as including "knowledge of the natural world and technological
          artefacts (content knowledge), knowledge of how such ideas are produced (procedural knowledge)
          and an understanding of the underlying rationale for these procedures and the justification
          for their use (epistemic knowledge)". Paragraph 81 describes procedural knowledge as "knowledge
          of the standard procedures and practices scientists use to obtain reliable and valid data" (Box
          7 lists variables, measurement, uncertainty, precision/accuracy, data representation, control
          of variables, peer vetting). Paragraph 82 defines epistemic knowledge and illustrates the distinction:
          explaining what the control-of-variables strategy is (procedural) versus why it is central to
          establishing knowledge (epistemic).'
        quote: Epistemic knowledge is a knowledge of the constructs and defining features essential to
          the process of knowledge construction in science and their role in justifying the knowledge
          produced by science.
        source_title: PISA 2025 Science Framework (Second Draft), Section 4, paras 74-87
        source_url: https://pisa-framework.oecd.org/science-2025/assets/docs/PISA_2025_Science_Framework.pdf
