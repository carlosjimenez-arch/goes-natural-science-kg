      - id: erce-niveles-desempeno-cortes
        framework: erce
        topic: performance-levels
        claim: ERCE 2019 Ciencias 6.º reports four niveles de desempeño with cut scores Nivel I up to
          668, Nivel II 669-781, Nivel III 782-861, Nivel IV from 862 points, on a scale with regional
          mean fixed at 700 (SD 100) in TERCE 2013.
        detail: The Ecuador national report gives "Nivel IV (Desde 862 puntos)", "Nivel III (Entre 782
          Y 861 puntos)", "Nivel II (Entre 669 Y 781 puntos)", "Nivel I (Hasta 668 puntos)". The regional
          summary explains scores are on the TERCE 2013 scale "donde se fijó el promedio regional en 700
          puntos con una desviación estándar de 100 puntos"; the ERCE 2019 regional mean in Ciencias was
          702. UNESCO proposes Nivel III as the expected level (nivel esperado) for 6.º Ciencias under
          Agenda 2030; only 20.7% of the region's students reached it.
        quote: Nivel III (Entre 782 Y 861 puntos)
        source_title: Estudio Regional Comparativo y Explicativo (ERCE 2019). Reporte nacional de resultados.
          Ecuador (UNESCO/OREALC 2021), Section 5.2.1
        source_url: https://evaluaciones.evaluacion.gob.ec/archivosPD/uploads/dlm_uploads/2022/03/Estudio-Regional-Comparativo-y-Explicativo-ERCE-2019.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: erce-niveles-descriptores-i-ii
        framework: erce
        topic: performance-levels
        claim: Nivel I and Nivel II descriptors describe recognition and simple relational tasks in everyday
          contexts.
        detail: 'Nivel I: "Reconocer acciones preventivas orientadas al cuidado de la salud en contextos
          cotidianos"; "Identificar la función de diferentes partes o estructuras del cuerpo humano";
          "Clasificar seres vivos a partir de la observación o la descripción de sus características".
          Nivel II: "Distinguir algunas relaciones de causa y efecto para el cuidado de la salud en contextos
          cotidianos"; "Identificar la ubicación o función de una estructura o parte de un ser vivo en
          un sistema mayor"; "Reconocer similitudes en las necesidades vitales de los seres vivos"; "Identificar
          posibles causas o efectos de fenómenos naturales en contextos cotidianos aplicando su conocimiento";
          "Identificar factores que influyen en el funcionamiento de circuitos eléctricos simples".'
        quote: Clasificar seres vivos a partir de la observación o la descripción de sus características.
        source_title: Estudio Regional Comparativo y Explicativo (ERCE 2019). Reporte nacional de resultados.
          Ecuador (UNESCO/OREALC 2021), Section 5.2.1
        source_url: https://evaluaciones.evaluacion.gob.ec/archivosPD/uploads/dlm_uploads/2022/03/Estudio-Regional-Comparativo-y-Explicativo-ERCE-2019.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: erce-niveles-descriptores-iii-iv
        framework: erce
        topic: performance-levels
        claim: Nivel III and Nivel IV descriptors introduce systems relations, natural cycles, scientific
          investigability and graph interpretation.
        detail: 'Nivel III: "Discriminar recomendaciones apropiadas de cuidado de la salud según criterios
          o requerimientos específicos (por ejemplo: de balance de nutrientes)"; "Reconocer la función
          específica de un elemento dentro de un sistema mayor o establecer relaciones entre sistemas";
          "Identificar los procesos que conforman ciclos naturales (por ejemplo: fotosíntesis, ciclo del
          agua) así como los factores que los afectan"; "Identificar la conclusión que se deriva de la
          información presentada en un gráfico"; "Identificar preguntas que son investigables científicamente
          o la hipótesis que orienta una investigación, o bien, evaluar la pertinencia de un diseño experimental
          o de una conclusión". Nivel IV: "Explicar un fenómeno demostrando su comprensión de las relaciones
          entre componentes de un sistema natural"; "Utilizar su conocimiento científico para interpretar
          un gráfico en que se representa la variación de factores involucrados en un proceso natural";
          "Analizar una actividad de investigación para seleccionar los datos que resultan pertinentes
          para responder la pregunta o para discriminar entre los distintos componentes de un diseño experimental".'
        quote: Explicar un fenómeno demostrando su comprensión de las relaciones entre componentes de
          un sistema natural.
        source_title: Estudio Regional Comparativo y Explicativo (ERCE 2019). Reporte nacional de resultados.
          Ecuador (UNESCO/OREALC 2021), Section 5.2.1
        source_url: https://evaluaciones.evaluacion.gob.ec/archivosPD/uploads/dlm_uploads/2022/03/Estudio-Regional-Comparativo-y-Explicativo-ERCE-2019.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: erce-indicador-minimal-unit
        framework: erce
        topic: minimal-unit
        claim: The minimal unit in ERCE science is the "indicador", each item being tagged with a Dominio,
          a Proceso cognitivo and an Indicador.
        detail: 'Released example items are presented with a three-row header: "Dominio", "Proceso cognitivo",
          "Indicador" (e.g. Nivel I item: Dominio "Seres vivos, ecología y medio ambiente", Proceso cognitivo
          "Análisis y aplicación del conocimiento científico", Indicador "Clasificar algunos animales
          en categorías taxonómicas de acuerdo con..."; Nivel III item: Indicador "Formular conclusiones
          a partir de información científica"; Nivel IV item: Indicador "Distinguir la información pertinente
          para dar respuesta a un problema"). The level descriptors are described as "una síntesis de
          la descripción de los indicadores utilizados para identificar los logros de aprendizaje".'
        quote: Esta precisión corresponde a una síntesis de la descripción de los indicadores utilizados
          para identificar los logros de aprendizaje en la región
        source_title: El estudio ERCE 2019 y los niveles de aprendizaje en Ciencias (LLECE/UNESCO material
          hosted by MINEDUC Guatemala DIGEDUCA)
        source_url: https://edu.mineduc.gob.gt/digeduca/documents/erce/2023/niveles_de_aprendizaje_ERCE19_ciencias.pdf
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: erce-no-fixed-sequence
        framework: erce
        topic: prerequisites-progression
        claim: LLECE explicitly states that regional science curricula have no fixed content sequence
          and that ERCE does not prescribe the order of topics; the only progression claim is the cumulative
          nature of the four levels.
        detail: 'The LLECE document states that in Ciencias "los currículos regionales no presentan una
          secuenciación fija de los contenidos o trayectorias temáticas" and "en ningún caso la presente
          descripción busca prescribir el orden en que las temáticas deben abordarse". It also notes some
          6.º topics are taught only in that grade while others are treated "desde los primeros grados,
          considerando la naturaleza acumulativa del aprendizaje". Progression is asserted only between
          levels: students at levels III-IV "también cuentan con las de los niveles inferiores, I y II".
          No prerequisite relations between dominios or indicadores are declared.'
        quote: en el área disciplinar de Ciencias los currículos regionales no presentan una secuenciación
          fija de los contenidos o trayectorias temáticas
        source_title: El estudio ERCE 2019 y los niveles de aprendizaje en Ciencias (LLECE/UNESCO material
          hosted by MINEDUC Guatemala DIGEDUCA)
        source_url: https://edu.mineduc.gob.gt/digeduca/documents/erce/2023/niveles_de_aprendizaje_ERCE19_ciencias.pdf
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: erce-analisis-curricular-temas
        framework: erce
        topic: curricular-analysis
        claim: The ERCE 2019 Análisis curricular (UNESCO 2020) categorised 6.º grade science content into
          "temas" or "dominios" using content analysis and produced matrices only for the grades tested,
          so science matrices exist only for 6.º.
        detail: 'The Chile national curricular-analysis document says contents "se categorizaron en dominios
          o temas mediante la técnica de análisis de contenido" and "Se realizó un análisis de contenidos
          del área de Ciencias Naturales para sexto grado". In the curricular-analysis stage the science
          themes were labelled slightly differently from the final test dominios: "La energía y sus manifestaciones",
          "Cuerpo humano y salud", "La Tierra y el universo", "Ecología y medioambiente", "La materia
          y sus transformaciones", "Ciencia, tecnología y sociedad" and "Seres vivos". The regional report
          is "¿Qué se espera que aprendan los estudiantes de América Latina y el Caribe? Análisis Curricular
          del ERCE 2019" (unesdoc pf0000373982; UNESDOC returned HTTP 403 so it was not fetched directly).'
        quote: Se realizó un análisis de contenidos del área de Ciencias Naturales para sexto grado y
          se identificaron algunas categorías comunes con el conjunto de los países
        source_title: Análisis curricular Estudio Regional Comparativo y Explicativo (ERCE 2019). Chile.
          Documento nacional de resultados (UNESCO/OREALC 2020)
        source_url: https://intranet.ciae.cl/uploads/resources/384/00_1629740528.pdf
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: erce-downward-inference-grades-2-5
        framework: erce
        topic: scope
        claim: Nothing in ERCE/LLECE can be directly used as a grade 2-5 science standard; only weak downward
          inferences are possible from the 6.º dominios and the Nivel I-II descriptors.
        detail: 'Because the science test, its dominios, procesos cognitivos, indicadores and niveles
          are all defined for 6.º only, no LLECE document gives grade-specific expectations for 2.º-5.º
          science; 3.º is tested only in Lectura, Escritura and Matemática. What can be inferred: the
          Nivel I and II descriptors (recognising health-care actions, body-part functions, classifying
          seres vivos, similarities in necesidades vitales, simple electrical circuits) represent the
          floor that most 6.º students already hold and therefore plausibly correspond to content taught
          in earlier grades; LLECE itself notes some content is treated "desde los primeros grados". What
          cannot be inferred: any grade-by-grade allocation, cut scores or weights for grades 2-5, since
          the levels are norm/criterion descriptions of 6.º performance, not a learning progression.'
        quote: La prueba del área de Ciencias Naturales es rendida sólo por los estudiantes de sexto grado
          de educación primaria.
        source_title: Estudio Regional Comparativo y Explicativo (ERCE 2019). Reporte nacional de resultados.
          Ecuador (UNESCO/OREALC 2021)
        source_url: https://evaluaciones.evaluacion.gob.ec/archivosPD/uploads/dlm_uploads/2022/03/Estudio-Regional-Comparativo-y-Explicativo-ERCE-2019.pdf
        retrieved_at: '2026-09-13'
        confidence: medium
      framework_profiles:
      - framework: pisa
        minimal_unit_name: item (independently scored question within a test unit); at framework level
          the smallest learning descriptor is a bulleted 'ability' under a competency
        nesting_levels: 3
        nesting_levels_named:
        - competency (3)
        - ability (bulleted list under each competency, 4-6 per competency)
        - item (classified by competency x knowledge type x system x context x cognitive demand)
        explicit_prerequisites: false
        progression_between_grades: PISA is age-based (15-year-olds) and defines a single target point,
          not a grade sequence. Progression is expressed through a described proficiency scale (Levels
          1c to 6) whose descriptors embed the Low/Medium/High cognitive-demand levels, and through the
          acknowledgement that 'a hierarchy of progression' exists within content and practices without
          enumerating it. No prerequisite relations between competencies, knowledge areas or systems are
          declared, and nothing is said about primary grades.
        source_ids:
        - pisa-source-version
        - pisa-competencies
        - pisa-competency-1-abilities
        - pisa-competency-2-3-abilities
        - pisa-knowledge-types
        - pisa-content-systems
        - pisa-contexts
        - pisa-cognitive-demand
        - pisa-score-distribution
        - pisa-unit-item-structure
        - pisa-no-prerequisites-progression
        - pisa-science-identity
      - framework: timss
        minimal_unit_name: objective
        nesting_levels: 4
        nesting_levels_named:
        - content domain (3 at grade 4)
        - topic area (5+3+3 = 11 at grade 4)
        - topic (numbered)
        - objective (lettered A, B, C)
        explicit_prerequisites: false
        progression_between_grades: 'TIMSS specifies two separate frameworks (grade 4 and grade 8) and
          describes progression narratively: grade 4 knowledge ''forms a foundation'' for later study,
          grade 8 objectives are ''more sophisticated'', and cognitive weights shift from Knowing/Applying/Reasoning
          40/40/20 to 35/35/30. Objectives are flat lists with equal item weight and no stated dependencies;
          each can be assessed in any cognitive domain. Grades 2-3 and 5-7 are not described.'
        source_ids:
        - timss-source-version
        - timss-g4-content-domains-weights
        - timss-g4-life-science-topics
        - timss-g4-physical-science-topics
        - timss-g4-earth-science-topics
        - timss-cognitive-domains-weights
        - timss-cognitive-behaviours
        - timss-science-practices
        - timss-minimal-unit-objective
        - timss-no-prerequisites-progression
      - framework: erce
        minimal_unit_name: indicador
        nesting_levels: 3
        nesting_levels_named:
        - dominio de conocimiento (5) crossed with proceso cognitivo (3)
        - indicador (specific expected learning, e.g. 'Formular conclusiones a partir de información científica')
        - ítem (each tagged with dominio, proceso cognitivo and indicador); results are reported in 4
          niveles de desempeño that synthesise indicadores
        explicit_prerequisites: false
        progression_between_grades: ERCE assesses science at a single grade (6.º) and explicitly states
          that regional curricula show no fixed sequencing of science content and that its descriptors
          do not prescribe topic order. The only progression is across the four niveles de desempeño (I-IV),
          which are cumulative (higher-level students are assumed to master lower-level competencies),
          and across the three procesos cognitivos ordered by complexity. Nothing is defined for grades
          2-5; only Nivel I-II descriptors can be loosely read as earlier-grade content.
        source_ids:
        - erce-scope-grades
        - erce-dominios
        - erce-dominios-definiciones
        - erce-procesos-cognitivos
        - erce-niveles-desempeno-cortes
        - erce-niveles-descriptores-i-ii
        - erce-niveles-descriptores-iii-iv
        - erce-indicador-minimal-unit
        - erce-no-fixed-sequence
        - erce-analisis-curricular-temas
        - erce-downward-inference-grades-2-5
    bncc_and_ngss:
      findings:
      - id: bncc-unidades-tematicas
        framework: bncc
        topic: structure
        claim: BNCC organizes Ciências (Ensino Fundamental) into three unidades temáticas that repeat
          every year from 1.º to 9.º ano.
        detail: The three unidades temáticas are "Matéria e energia", "Vida e evolução" and "Terra e Universo".
          The text states they "se repetem ao longo de todo o Ensino Fundamental" and must be treated
          as continuous and integrated, not developed in isolation. Each unidade groups objetos de conhecimento,
          which in turn group habilidades. The document says this arrangement is one possible arrangement,
          not a mandatory model for curricula.
        quote: as aprendizagens essenciais a ser asseguradas neste componente curricular foram organizadas
          em três unidades temáticas que se repetem ao longo de todo o Ensino Fundamental.
        source_title: Base Nacional Comum Curricular - Educação é a Base (versão final, PDF), seção 4.3.1
          Ciências, p. 325
        source_url: https://basenacionalcomum.mec.gov.br/images/BNCC_EI_EF_110518_versaofinal_site.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: bncc-nesting-hierarchy
        framework: bncc
        topic: structure
        claim: Within a component (Ciências), BNCC nests unidades temáticas > objetos de conhecimento
          > habilidades, presented in per-year tables.
        detail: 'The Estrutura chapter explains: "Cada unidade temática contempla uma gama maior ou menor
          de objetos de conhecimento, assim como cada objeto de conhecimento se relaciona a um número
          variável de habilidades". The example table shown is "CIÊNCIAS – 1º ANO" with columns "UNIDADES
          TEMÁTICAS", "OBJETOS DE CONHECIMENTO", "HABILIDADES". Above the component sit the área (Ciências
          da Natureza) and the etapa (Ensino Fundamental), with competências gerais and competências específicas
          as framing rather than nesting levels of habilidades. E.g., for 2.º ano, "Matéria e energia"
          has objetos "Propriedades e usos dos materiais" and "Prevenção de acidentes domésticos".'
        quote: Cada unidade temática contempla uma gama maior ou menor de objetos de conhecimento, assim
          como cada objeto de conhecimento se relaciona a um número variável de habilidades
        source_title: Base Nacional Comum Curricular - Educação é a Base (versão final, PDF), Estrutura
          da BNCC, p. 28-29
        source_url: https://basenacionalcomum.mec.gov.br/images/BNCC_EI_EF_110518_versaofinal_site.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: bncc-habilidade-code-format
        framework: bncc
        topic: code_format
        claim: Each BNCC habilidade has an alphanumeric code of the form EF + year (2 digits) + component
          (2 letters) + sequence (2 digits), e.g. EF02CI01.
        detail: 'The BNCC explains using the example "EF67EF01": the first pair of letters indicates the
          etapa (EF = Ensino Fundamental); the first pair of numbers indicates the year 01–09 (or a block
          of years for Língua Portuguesa, Arte, Educação Física, e.g. 15, 69, 12, 35, 67, 89); the second
          pair of letters indicates the component ("CI = Ciências", also AR, EF, ER, GE, HI, LI, LP, MA);
          the last pair of numbers indicates the habilidade position in the sequential numbering of the
          year. So EF02CI01 = Ensino Fundamental, 2.º ano, Ciências, habilidade 1. The BNCC stresses that
          the sequential number does not indicate order or hierarchy.'
        quote: O primeiro par de letras indica a etapa de Ensino Fundamental. O primeiro par de números
          indica o ano (01 a 09) a que se refere a habilidade [...] O segundo par de letras indica o componente
          curricular [...] O último par de números indica a posição da habilidade
        source_title: Base Nacional Comum Curricular - Educação é a Base (versão final, PDF), Estrutura
          da BNCC, p. 30
        source_url: https://basenacionalcomum.mec.gov.br/images/BNCC_EI_EF_110518_versaofinal_site.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: bncc-habilidade-sentence-structure
        framework: bncc
        topic: structure
        claim: 'BNCC habilidades are written in a fixed sentence structure: cognitive verb(s) + complement
          (objeto de conhecimento) + modifiers (context/specification).'
        detail: 'Using the History example EF06HI14 ("Diferenciar escravidão, servidão e trabalho livre
          no mundo antigo."), the BNCC labels three parts: "Verbo(s) que explicita(m) o(s) processo(s)
          cognitivo(s) envolvido(s) na habilidade", "Complemento do(s) verbo(s), que explicita o(s) objeto(s)
          de conhecimento mobilizado(s)", and "Modificadores [...] que explicitam o contexto e/ou uma
          maior especificação da aprendizagem esperada". Habilidades describe student learning, not teacher
          actions or methodologies.'
        quote: as habilidades não descrevem ações ou condutas esperadas do professor, nem induzem à opção
          por abordagens ou metodologias.
        source_title: Base Nacional Comum Curricular - Educação é a Base (versão final, PDF), Estrutura
          da BNCC, p. 29
        source_url: https://basenacionalcomum.mec.gov.br/images/BNCC_EI_EF_110518_versaofinal_site.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: bncc-count-habilidades-per-year
        framework: bncc
        topic: counts
        claim: Ciências has 6, 8, 10, 11, 13, 14, 16, 16 and 17 habilidades for 1.º to 9.º ano respectively
          (114 total).
        detail: 'Counted by extracting unique codes matching (EF0nCIxx) from the final BNCC PDF text:
          EF01CI 6, EF02CI 8, EF03CI 10, EF04CI 11, EF05CI 13, EF06CI 14, EF07CI 16, EF08CI 16, EF09CI
          17. Highest codes confirm: EF06CI14 and EF09CI17 exist. For the requested range: 2.º ano 8,
          3.º ano 10, 4.º ano 11, 5.º ano 13, 6.º ano 14.'
        quote: null
        source_title: Base Nacional Comum Curricular - Educação é a Base (versão final, PDF), quadros
          de Ciências 1.º–9.º ano
        source_url: https://basenacionalcomum.mec.gov.br/images/BNCC_EI_EF_110518_versaofinal_site.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: bncc-competencias-especificas
        framework: bncc
        topic: competencies
        claim: BNCC defines 8 competências específicas de Ciências da Natureza para o Ensino Fundamental.
        detail: 'Verbatim openings: 1 "Compreender as Ciências da Natureza como empreendimento humano,
          e o conhecimento científico como provisório, cultural e histórico."; 2 "Compreender conceitos
          fundamentais e estruturas explicativas das Ciências da Natureza, bem como dominar processos,
          práticas e procedimentos da investigação científica..."; 3 "Analisar, compreender e explicar
          características, fenômenos e processos relativos ao mundo natural, social e tecnológico (incluindo
          o digital)..."; 4 "Avaliar aplicações e implicações políticas, socioambientais e culturais da
          ciência e de suas tecnologias..."; 5 "Construir argumentos com base em dados, evidências e informações
          confiáveis..."; 6 "Utilizar diferentes linguagens e tecnologias digitais de informação e comunicação...";
          7 "Conhecer, apreciar e cuidar de si, do seu corpo e bem-estar..."; 8 "Agir pessoal e coletivamente
          com respeito, autonomia, responsabilidade, flexibilidade, resiliência e determinação...".'
        quote: Compreender as Ciências da Natureza como empreendimento humano, e o conhecimento científico
          como provisório, cultural e histórico.
        source_title: Base Nacional Comum Curricular - Educação é a Base (versão final, PDF), Competências
          específicas de Ciências da Natureza para o Ensino Fundamental, p. 324
        source_url: https://basenacionalcomum.mec.gov.br/images/BNCC_EI_EF_110518_versaofinal_site.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: bncc-processo-investigativo
        framework: bncc
        topic: practices
        claim: 'BNCC frames scientific investigation as central and lists student actions grouped in four
          moments: Definição de problemas; Levantamento, análise e representação; Comunicação; Intervenção.'
        detail: The Ciências da Natureza area text presents a bulleted list of what science teaching should
          let students do (e.g., "Observar o mundo a sua volta e fazer perguntas", "Propor hipóteses",
          "Elaborar explicações e/ou modelos", "Relatar informações de forma oral, escrita ou multimodal",
          "Implementar soluções e avaliar sua eficácia"), with side labels "Definição de problemas", "Levantamento,
          análise e representação", "Comunicação", "Intervenção". This is the BNCC analogue of practices,
          but it is not a coded dimension attached to each habilidade.
        quote: o processo investigativo deve ser entendido como elemento central na formação dos estudantes
        source_title: Base Nacional Comum Curricular - Educação é a Base (versão final, PDF), 4.3 A área
          de Ciências da Natureza, p. 322-323
        source_url: https://basenacionalcomum.mec.gov.br/images/BNCC_EI_EF_110518_versaofinal_site.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: bncc-progression-general
        framework: bncc
        topic: progression
        claim: BNCC states that sequential numbering implies no order or hierarchy, and that progression
          is visible only by comparing year tables, via more demanding verbs, more sophisticated objetos,
          or wider-context modifiers.
        detail: 'The Estrutura chapter: "o uso de numeração sequencial para identificar as habilidades
          de cada ano ou bloco de anos não representa uma ordem ou hierarquia esperada das aprendizagens."
          Progression "pode tanto estar relacionada aos processos cognitivos em jogo – sendo expressa
          por verbos que indicam processos cada vez mais ativos ou exigentes – quanto aos objetos de conhecimento
          – que podem apresentar crescente sofisticação ou complexidade –, ou, ainda, aos modificadores".
          No explicit prerequisite links between habilidades are declared anywhere in the tables.'
        quote: não representa uma ordem ou hierarquia esperada das aprendizagens. A progressão das aprendizagens,
          que se explicita na comparação entre os quadros relativos a cada ano
        source_title: Base Nacional Comum Curricular - Educação é a Base (versão final, PDF), Estrutura
          da BNCC, p. 30-31
        source_url: https://basenacionalcomum.mec.gov.br/images/BNCC_EI_EF_110518_versaofinal_site.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: bncc-progression-ciencias
        framework: bncc
        topic: progression
        claim: In Ciências, BNCC says habilidades within each unidade temática grow progressively in complexity
          across years and explains the intended meaning of verbs like observar, relatar, apresentar.
