      - id: expert-blind-spot-scheines
        topic: evidence_reliability
        claim: Scheines, Silver and Goldin argue that expert opinion is not a reliable way to determine
          topic order (expert blind spot) and that asking experts about every pair is prohibitively costly,
          motivating causal discovery over latent skills; their approach nonetheless presupposes a known
          Q-matrix and assessment data.
        detail: 'EDM 2014 short paper: ''we suspect that expert opinions are not a reliable way to determine
          effective topic order'' and ''asking experts is prohibitively costly''. The method treats skills
          as latent variables, assumes the Q-matrix is known, estimates a latent correlation matrix, and
          runs causal search; validated on simulation and a ~120-student developmental math assessment.
          It explicitly contrasts skill-level prerequisites with KST''s item-level relations.'
        quote: we suspect that expert opinions are not a reliable way to determine effective topic order.
        source_title: Discovering Prerequisite Relationships among Knowledge Components, R. Scheines,
          E. Silver, I. Goldin, EDM 2014
        source_url: https://www.stat.cmu.edu/~brian/nynke/726-2021/week06/HCI%20prereq%20discovery/ScheinesSilverGoldin-EDM2014.pdf
