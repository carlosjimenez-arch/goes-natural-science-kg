      - id: ngss-three-dimensions
        framework: ngss
        topic: structure
        claim: 'NGSS is built on three dimensions from the NRC Framework: Science and Engineering Practices,
          Crosscutting Concepts, and Disciplinary Core Ideas.'
        detail: 'The nextgenscience.org page names them "Dimension 1: Practices", "Dimension 2: Crosscutting
          Concepts", "Dimension 3: Disciplinary Core Ideas" and lists the four DCI domains as "the physical
          sciences; the life sciences; the earth and space sciences; and engineering, technology and applications
          of science". Appendix G says the Framework "recommends science education in grades K-12 be built
          around three major dimensions: scientific and engineering practices; crosscutting concepts [...];
          and core ideas in the major disciplines of natural science."'
        quote: Each performance expectation incorporates all three dimensions from the Framework— a science
          or engineering practice, a core disciplinary idea, and a crosscutting concept.
        source_title: Three Dimensions | Next Generation Science Standards
        source_url: https://www.nextgenscience.org/three-dimensions
        retrieved_at: '2026-09-13'
        confidence: high
      - id: ngss-eight-practices
        framework: ngss
        topic: dimensions
        claim: There are eight Science and Engineering Practices, listed in Box 3-1 of the Framework.
        detail: 1 "Asking questions (for science) and defining problems (for engineering)"; 2 "Developing
          and using models"; 3 "Planning and carrying out investigations"; 4 "Analyzing and interpreting
          data"; 5 "Using mathematics and computational thinking"; 6 "Constructing explanations (for science)
          and designing solutions (for engineering)"; 7 "Engaging in argument from evidence"; 8 "Obtaining,
          evaluating, and communicating information". Appendix F uses the same eight as headings Practice
          1–Practice 8 and states "Students in grades K-12 should engage in all eight practices over each
          grade band."
        quote: Students in grades K-12 should engage in all eight practices over each grade band.
        source_title: 'A Framework for K-12 Science Education, Chapter 3: Dimension 1: Scientific and
          Engineering Practices (NAP.edu); NGSS Appendix F'
        source_url: https://www.nationalacademies.org/read/13165/chapter/7
        retrieved_at: '2026-09-13'
        confidence: high
      - id: ngss-seven-crosscutting-concepts
        framework: ngss
        topic: dimensions
        claim: There are seven Crosscutting Concepts.
        detail: 'Appendix G lists verbatim: "1. Patterns." "2. Cause and effect: Mechanism and explanation."
          "3. Scale, proportion, and quantity." "4. Systems and system models." "5. Energy and matter:
          Flows, cycles, and conservation." "6. Structure and function." "7. Stability and change." The
