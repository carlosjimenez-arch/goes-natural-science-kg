      - id: pisa-cognitive-demand
        framework: pisa
        topic: cognitive-demand
        claim: PISA 2025 explicitly defines three levels of cognitive demand (Low, Medium, High) as a
          third dimension for classifying items, drawing on Webb's Depth of Knowledge.
        detail: 'Section 5 "Assessment Features" distinguishes empirical item difficulty from cognitive
          demand ("the type of mental processing required"). Low (L) = one-step procedure such as recall
          of a fact or locating one point in a graph; Medium (M) = applying knowledge in two or more steps
          or relating two ideas in familiar contexts; High (H) = analysing complex information, synthesising
          or evaluating evidence, developing a plan, critiquing flawed arguments, often in unfamiliar
          contexts. Four factors determine demand: number/complexity of knowledge elements, familiarity,
          cognitive operation required, and dependence on models or abstract ideas. Every worked example
          item is tagged with a cognitive demand (e.g. GREENHOUSE Question 4 = High).'
        quote: each item can also be mapped using a third dimension based on a depth of knowledge taxonomy.
          This provides a means of operationalising cognitive demand
        source_title: PISA 2025 Science Framework (Second Draft), Section 5 Cognitive Demand, paras 107-117
        source_url: https://pisa-framework.oecd.org/science-2025/assets/docs/PISA_2025_Science_Framework.pdf
