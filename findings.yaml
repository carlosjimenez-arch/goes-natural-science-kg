      - id: expert-structures-seldom-tested
        topic: evidence_reliability
        claim: Chen, Wuillemin and Labat note that expert-built prerequisite structures of skills are
          seldom tested empirically and that structures from different experts on the same domain are
          likely to differ; discovering them from data is hard because skills are latent.
        detail: 'EDM 2015 paper on probabilistic association-rule mining of prerequisite structures: ''The
          prerequisite structures of skills are usually studied by human experts, but they are seldom
          tested empirically'', and it is ''quite likely that the prerequisite structures from different
          experts on the same domain are different''. The method needs student knowledge-state estimates
          from DINA/NIDA evidence models on multi-skill items, i.e., response data.'
        quote: The prerequisite structures of skills are usually studied by human experts, but they are
          seldom tested empirically.
        source_title: Discovering Prerequisite Structure of Skills through Probabilistic Association Rules
          Mining, Y. Chen, P.-H. Wuillemin, J.-M. Labat, EDM 2015
