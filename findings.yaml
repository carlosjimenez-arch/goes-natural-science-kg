      - id: ngss-performance-expectation-definition
        framework: ngss
        topic: structure
        claim: The minimal assessable unit of NGSS is the performance expectation (PE), a statement of
          what students should be able to do, each combining one SEP, one DCI element and one CCC.
        detail: '"Performance expectations are the assessable statements of what students should know
          and be able to do." Each PE may be followed by a "Clarification Statement" (examples/clarification)
          and an "Assessment Boundary" (limits for large-scale assessment). PEs are grouped into titled
          standards/topic arrangements; below the PE box are three Foundation Boxes (SEP, DCI, CCC) and
          three Connection Boxes. The document notes some states treat PEs alone as "the standards" while
          others include the foundation boxes.'
        quote: Performance expectations are the assessable statements of what students should know and
          be able to do.
        source_title: How to Read the Next Generation Science Standards (PDF)
        source_url: https://www.nextgenscience.org/sites/default/files/resource/files/How%20to%20Read%20NGSS%20-%20Final%2008.19.13.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: ngss-pe-code-format
        framework: ngss
        topic: code_format
        claim: 'A PE code has the form <grade or band>-<core idea>-<sequence>, e.g. 3-LS4-2: grade 3,
          core idea LS4 (Biological Evolution), second PE in that cluster.'
        detail: 'How to Read NGSS: "the first digit indicates a grade K-5, or specifies MS (middle school)
          or HS (high school). The next alpha-numeric code specifies the discipline, core idea and sub-idea.
          [...] Finally, the number at the end of each code indicates the order in which that statement
          appeared as a DCI in the Framework." Engineering PEs use band codes: K-2-ETS1-1, 3-5-ETS1-1,
          MS-ETS1-1. In connection boxes DCI elements are referenced with dot notation and grade, e.g.
          "MS.LS2.A", "5.PS1.A", "2.PS1.A".'
        quote: the first digit indicates a grade K-5, or specifies MS (middle school) or HS (high school).
          The next alpha-numeric code specifies the discipline, core idea and sub-idea.
        source_title: How to Read the Next Generation Science Standards (PDF)
        source_url: https://www.nextgenscience.org/sites/default/files/resource/files/How%20to%20Read%20NGSS%20-%20Final%2008.19.13.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: ngss-foundation-boxes
        framework: ngss
        topic: structure
        claim: Each standard page has three Foundation Boxes (SEP, DCI, CCC) whose statements carry the
          codes of the PEs they were used to build.
        detail: '"Below that are three foundation boxes, which list (from left to right) the specific
          science and engineering practices, disciplinary core ideas (DCIs), and crosscutting concepts
          that were combined to produce the performance expectations (PEs) above." DCI statements are
          taken from the Framework and bulleted; SEP and CCC statements are grade-band-specific elements.
          The CCC box also lists Nature of Science and engineering/technology/society connections. Online
          versions color-code PE text: blue SEP, orange DCI, green CCC.'
        quote: Since most of the standards have several PEs, the codes make it easy to see how the information
          in the foundation boxes is used to construct each performance expectation.
        source_title: How to Read the Next Generation Science Standards (PDF)
        source_url: https://www.nextgenscience.org/sites/default/files/resource/files/How%20to%20Read%20NGSS%20-%20Final%2008.19.13.pdf
        retrieved_at: '2026-09-13'
