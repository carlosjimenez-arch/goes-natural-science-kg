      - id: pisa-unit-item-structure
        framework: pisa
        topic: minimal-unit
        claim: PISA's assessment is structured as "test units" (a stimulus with several items); the "item"
          is the independently scored minimal unit, and each item is classified by competency, knowledge
          type, system, context and cognitive demand.
        detail: Para 120 defines a test unit by its stimulus material (passage, table, chart, graph, diagram,
          animation or simulation) with "a set of independently scored questions of various types" called
          items. Para 122 says units will draw on all three competencies and all three knowledge forms,
          whereas "Individual items, however, may only assess only one form of knowledge and one competency".
          Figure 3 is described as "a tool for constructing and analysing assessment units and items".
