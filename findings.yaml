      - id: cpre-lp-hypotheses-not-one-path
        topic: learning_progressions
        claim: The CPRE report defines learning progressions as empirically grounded, testable hypotheses,
          insists there is not likely to be one best pathway, and specifies five components including
          levels of achievement and learning performances as operational definitions.
        detail: 'Corcoran, Mosher and Rogat (2009) write that progressions ''describe the pathways students
          are likely to follow'' and are tested for construct and consequential validity; ''it is not
          assumed that there is likely to be one best progression or pathway''. Five components: learning
          targets, progress variables, levels of achievement, learning performances (operational definitions),
          and assessments. The report also says empirical evidence shows that at any grade the range of
          students'' positions varies widely and that progressions do not necessarily specify ages. Implication:
          a curriculum graph should separate the hypothesised order (edges) from grade placement (a solver
          output), and should carry level descriptors readable by teachers.'
        quote: However, it is not assumed that there is likely to be one best progression or pathway.
          The number and nature of productive pathways are treated as empirical questions
        source_title: 'Learning Progressions in Science: An Evidence-Based Approach to Reform, CPRE Research
          Report RR-63, T. Corcoran, F. A. Mosher, A. Rogat, 2009'
        source_url: https://cpre.org/sites/default/files/researchreport/829_lpsciencerr63.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: cpre-standards-overloaded-lists
        topic: learning_progressions
        claim: CPRE characterises current standards as negotiated lists seldom rooted in evidence about
          what can be learned in the available time, with many more topics per grade than can be treated
          beyond a superficial level, which is precisely the failure mode a time-budgeted sequencing model
          must prevent.
        detail: The report states standards 'are often a negotiated list resulting from the experience,
          preferences, and influence of adult stakeholders and are seldom rooted in direct evidence of
          whether most children can learn everything expected within the time and resources schools provide',
          giving teachers 'considerable incentive to favor coverage over depth'. This is direct support
          for attaching explicit time weights to skills and enforcing a hard per-grade budget.
        quote: they often include many more topics at each grade than it is reasonable to think teachers
          and students can address at anything more than a superficial level.
        source_title: 'Learning Progressions in Science: An Evidence-Based Approach to Reform, CPRE Research
          Report RR-63, T. Corcoran, F. A. Mosher, A. Rogat, 2009'
        source_url: https://cpre.org/sites/default/files/researchreport/829_lpsciencerr63.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: nrc-2007-conjectural-progressions
        topic: learning_progressions
        claim: NRC's Taking Science to School defines learning progressions over 6-8 year spans, calls
          long-term progressions conjectural and open to empirical investigation, and states no single
          progression is ideal for all children.
        detail: Chapter 8 defines progressions as 'descriptions of the successively more sophisticated
          ways of thinking about a topic that can follow one another as children learn about and investigate
          a topic over a broad span of time (e.g., 6 to 8 years)', notes that 'our ideas about longer
          term learning progressions are conjectural', and that 'no single learning progression will be
          ideal for all children'. It also criticises textbooks that 'covered too many topics and didn't
          develop any of them well'. Grain size is coarse (big ideas across grade bands), far coarser
          than micro-skills; a curriculum graph needs a hierarchy overlay to connect micro-skills back
          to these big ideas.
        quote: our ideas about longer term learning progressions are conjectural—ideas about how understanding
          could be developed given sustained and appropriate instructional practices
        source_title: 'Taking Science to School: Learning and Teaching Science in Grades K-8, National
          Research Council, 2007, Chapter 8 Learning Progressions'
        source_url: https://www.nationalacademies.org/read/11625/chapter/10
        retrieved_at: '2026-09-13'
        confidence: high
      - id: ngss-appendix-e-grade-bands
        topic: learning_progressions
        claim: NGSS Appendix E presents disciplinary core idea progressions as tables by grade band (K-2,
          3-5, 6-8, 9-12), explicitly deliberately limiting the number of core ideas to allow depth, and
          warns against separating core ideas from practices and crosscutting concepts.
        detail: 'The appendix quotes the Framework: it ''focuses on a limited number of core ideas'' to
          ''avoid the shallow coverage of a large number of topics and to allow more time for teachers
          and students to explore each idea in greater depth'', and states ''This progression is for reference
          only''. Progressions are tree-like (DCI > sub-idea > grade-band statement) with no explicit
          lateral prerequisite links between sub-ideas, illustrating candidate E in its official form.
          Grades 2-6 straddle two bands (K-2 and 3-5), so a grade-level model must refine the band endpoints.'
        quote: This document in no way endorses separating the disciplinary core ideas from the other
          two dimensions.
        source_title: Appendix E - Progressions Within the Next Generation Science Standards, Achieve/NGSS
          Lead States, 2013 (rev. 2017)
        source_url: https://www.nextgenscience.org/sites/default/files/resource/files/AppendixE-ProgressionswithinNGSS-061617.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: dlm-learning-map-scale
        topic: candidate_a_dag
        claim: Dynamic Learning Maps operationalise a large expert-and-research-built node/connection
          graph (about 2,400 mathematics nodes and 5,200 connections) that shows multiple pathways and
          is used by teachers to locate students and plan instruction.
        detail: The DLM model page describes nodes as individual concepts and skills, connections that
          show 'different ways students reach the same goals', and reports (April 2016) 2,089 ELA nodes
          with 5,045 connections and 2,399 mathematics nodes with 5,200 connections, plus 150 shared foundational
          nodes; the map rests on research synthesis and 'continual review and refinement by experts'.
          Assessment uses 'linkage levels' that are small collections of nodes, i.e., a hierarchy overlay
          on the graph. This is a real-world precedent for a DAG plus grouping overlay maintained without
          probabilistic parameters.
        quote: effective teachers need to understand how knowledge and skills are connected
        source_title: What Is A Learning Map Model?, Dynamic Learning Maps, University of Kansas
        source_url: https://dynamiclearningmaps.org/model
        retrieved_at: '2026-09-13'
        confidence: high
      - id: teachers-reading-learning-maps
        topic: candidate_a_dag
        claim: Studies with teachers using learning map systems found that maps give valuable insight
          into how students learn but teachers need additional scaffolds, want materials that explicitly
          point out multiple pathways and essential prerequisites, and less experienced teachers benefit
          most from seeing learning sequences.
        detail: Kingston and Broaddus (Education Sciences 2017) report that their investigations of how
          teachers use learning map systems agreed with Furtak, Morrison and Kroog that 'although organized
          learning models provide teachers valuable insights to how students learn, teachers need additional
          scaffolds'. Teachers wanted materials describing 'essential prerequisites and important conceptual
          connections', maps that 'explicitly point out multiple pathways when they exist', and one teacher
          described changing fraction-multiplication instruction after reading the map. No comparable
          evidence was found that teachers can audit probability tables or Q-matrices; the paper's evidence
          is about node/edge maps with plain-language node descriptors.
        quote: Materials should explicitly point out multiple pathways when they exist, allowing for variations
          in student learning and instructional approaches.
        source_title: The Use of Learning Map Systems to Support the Formative Assessment in Mathematics,
          N. M. Kingston, A. Broaddus, Education Sciences 7(1):41, 2017
        source_url: https://files.eric.ed.gov/fulltext/EJ1135002.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: knewton-graph-experts-weeks
        topic: candidate_a_dag
        claim: Knewton's knowledge graph is a typed ontology (containment, assessment, instruction, prerequisiteness)
          authored by trained subject-matter experts in a few weeks per textbook, with student-data refinement
          layered on afterwards.
        detail: The 2015 Knewton technical white paper lists relationship types in its adaptive ontology,
          including 'containment (content or concepts belonging to larger groups)' and 'prerequisiteness
          (concepts requiring understanding of earlier concepts)', and states that 'The content in a typical
          textbook can be expressed in the Knewton adaptive ontology in a few weeks of manual effort by
          a trained subject matter expert', with automated methods optionally combining content and interaction
          data. This is an industrial precedent for candidate F's typed DAG plus hierarchy overlay, built
          without data first.
        quote: The content in a typical textbook can be expressed in the Knewton adaptive ontology in
          a few weeks of manual effort by a trained subject matter expert.
        source_title: 'The Knewton Platform: A General-Purpose Adaptive Learning Infrastructure (Technical
          White Paper), K. Wilson, Z. Nichols, Knewton, 2015'
        source_url: https://www.profijt.nu/wp-content/uploads/2015/09/20150902-White-paper-The-Knewton-Platform.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: case-association-types
        topic: standards_interchange
        claim: 1EdTech CASE represents competency frameworks as CFItems linked by typed CFAssociations
          (isChildOf for the tree, precedes for progression/sequence, exemplar, isPartOf, isPeerOf, isRelatedTo
          as default, exactMatchOf, replacedBy, hasSkillLevel, isTranslationOf), but has no construct
          for AND/OR prerequisite groups or time allocations.
        detail: The CASE v1.0 best-practice guide defines isChildOf as connecting a CFItem to its parent
          CFItem (or CFDocument for top nodes), precedes as 'the origin of the association comes before
          the destination of the association in time, sequence, learning progression', exemplar as pointing
          to a learning resource, isPartOf as physical/logical inclusion and isRelatedTo as the fallback
          type. The v1.1 implementation guide shows a state framework using ~2,300 isChildOf and ~1,770
          precedes associations. Neither document exposes conjunctive groups or duration fields; the v1.1
          spec allows 'ext:' extension types. Hence CASE is a viable export/interchange target for the
          tree plus untyped precedence edges, and AND/OR groups plus minute weights must be carried as
          extensions.
        quote: the origin of the association comes before the destination of the association in time,
          sequence, learning progression.
        source_title: Competencies and Academic Standards Exchange (CASE) Service v1.0 Best Practices
          and Implementation Guide, IMS Global, 2017
        source_url: https://www.imsglobal.org/sites/default/files/CASE/casev1p0/best_practices/caseservicev1p0_bestpracticesv1p0.html
        retrieved_at: '2026-09-13'
        confidence: high
      - id: case-v11-example-counts
        topic: standards_interchange
        claim: A real CASE v1.1 deployment (Georgia K-12 standards) uses isChildOf to define the hierarchical
          tree and precedes to chain the same standard across grade levels (e.g., 3.L.V.2.a precedes 4.L.V.2.a),
          showing that national frameworks in CASE are trees with grade-to-grade progression links rather
          than skill prerequisite graphs.
        detail: The v1.1 implementation guide's example reports about 2,300 isChildOf associations building
          the tree and about 1,770 precedes associations representing 'competency progressions through
          grade levels'. This is the practical form of candidate E with a thin progression overlay; it
          does not encode lateral prerequisites between different strands.
        quote: These associations define a hierarchical tree structure for the CFItems.
        source_title: Competencies and Academic Standards Exchange (CASE) v1.1 Best Practice and Implementation
          Guide, IMS Global / 1EdTech
        source_url: https://www.imsglobal.org/spec/CASE/v1p1/impl
        retrieved_at: '2026-09-13'
        confidence: high
      comparison:
      - candidate: A. Prerequisite DAG (untyped edges)
        scores:
          expressiveness_and_or: 2
          time_constrained_sequencing: 4
          teacher_auditability: 4
          maintenance_cost: 4
          counterfactual_grade_move: 4
        justification:
          expressiveness_and_or: Multiple in-edges are implicitly AND (all predecessors before successor);
            OR/alternative prerequisites cannot be expressed, which is exactly the approximation POKS
            makes by assuming intersection-closure (poks-dag-approximation-drops-or). Co-requisites can
            only be faked with a shared parent.
          time_constrained_sequencing: Grade assignment under a per-grade budget is the partially ordered
            knapsack, strongly NP-complete in general (precedence-knapsack-np-hard) but well suited to
            CP-SAT with presence literals and reified precedences (cpsat-optional-intervals-precedence);
            sparse tree-like graphs make it easier (precedence-structure-complexity-survey).
          teacher_auditability: Node/edge maps with plain-language node descriptors are what teachers
            demonstrably read and act on (teachers-reading-learning-maps, dlm-learning-map-scale); teachers
            could judge link quality in a survey (assistments-teacher-survey-links). Loses a point because
            an untyped flat graph of hundreds of micro-skills has no grouping to navigate.
          maintenance_cost: Adding or moving a node changes only its incident edges; acyclicity and transitive-reduction
            checks are linear. No parameters to re-estimate. But without provenance/confidence fields
            the map cannot record which links are contested (expert-prereq-agreement-kappa, carnegie-expert-vs-data-prereqs).
          counterfactual_grade_move: 'Moving a skill to an earlier grade yields immediately: set of predecessors
            now scheduled later (violated edges), transitive downstream set, and per-grade budget deltas
            from node weights; re-solve gives a new feasible plan. Cannot say anything about expected
            mastery.'
        requires_learner_data: false
        source_ids:
        - poks-dag-approximation-drops-or
        - precedence-knapsack-np-hard
        - cpsat-optional-intervals-precedence
        - teachers-reading-learning-maps
        - dlm-learning-map-scale
        - assistments-teacher-survey-links
        - carnegie-expert-vs-data-prereqs
      - candidate: B. Hypergraph / AND-OR graph
        scores:
          expressiveness_and_or: 5
          time_constrained_sequencing: 3
          teacher_auditability: 3
          maintenance_cost: 3
          counterfactual_grade_move: 4
        justification:
          expressiveness_and_or: 'Exactly the surmise-function semantics: one clause = AND set, several
            clauses = OR of alternatives (kst-surmise-function-clauses); AND/OR precedence constraints
            are a recognised generalisation in scheduling (andor-feasibility-linear-time).'
          time_constrained_sequencing: Feasibility and earliest-start computations stay linear/polynomial
            (andor-feasibility-linear-time), but optimisation with mixed AND/OR constraints is NP-hard
            even in restricted settings and harder than pure AND (andor-scheduling-hardness); OR-groups
            become disjunctions over presence literals in CP-SAT, which is fine when they are rare.
          teacher_auditability: OR-groups and hyperedges are harder to draw and read than simple arrows;
            the DLM/ELM evidence concerns simple node-edge maps, and teachers asked for 'multiple pathways'
            to be pointed out explicitly in materials rather than inferred from the diagram (teachers-reading-learning-maps).
            ALEKS experience shows experts answer single-prerequisite queries reliably but multi-item
            queries unreliably (kst-query-routine-expert-reliability).
          maintenance_cost: Every edit must preserve clause minimality and acyclicity across clauses;
            OR-alternatives are the part of KST that in practice is inferred from large datasets, not
            experts (kst-query-routine-expert-reliability), so hand-maintained OR-groups will be low-confidence.
          counterfactual_grade_move: Same computations as a DAG plus 'is at least one alternative clause
            satisfied earlier', computable in linear time (andor-feasibility-linear-time).
        requires_learner_data: false
        source_ids:
        - kst-surmise-function-clauses
        - andor-feasibility-linear-time
        - andor-scheduling-hardness
        - kst-query-routine-expert-reliability
        - teachers-reading-learning-maps
      - candidate: C. Probabilistic prerequisite networks (BKT, POKS, Bayesian nets, LP with uncertainty)
        scores:
          expressiveness_and_or: 4
          time_constrained_sequencing: 2
          teacher_auditability: 2
          maintenance_cost: 1
          counterfactual_grade_move: 2
        justification:
          expressiveness_and_or: Bayesian nets can encode noisy-AND / noisy-OR gates over prerequisites
            and graded strengths; POKS however collapses to a DAG (poks-dag-approximation-drops-or); BKT
            has no inter-skill structure at all (bkt-corbett-anderson-needs-fit).
          time_constrained_sequencing: No native notion of time budget or grade; sequencing would need
            an outer optimiser over expected mastery, which requires calibrated parameters that do not
            exist at design time (ecd-dbn-data-requirement).
          teacher_auditability: Conditional probability tables and slip/guess parameters are not teacher-facing
            artefacts; the located evidence on teacher use concerns node/edge maps, not probability tables
            (teachers-reading-learning-maps). Learning-progression BN design itself needs iterative expert-modeller
            work (ecd-dbn-data-requirement).
          maintenance_cost: Every structural change invalidates CPTs/BKT parameters, which must be re-fit
            from data (1,450 students for one LP in ecd-dbn-data-requirement; tens of thousands of steps
            in lfa-expert-models-improved-by-data); we have no learner data, so the layer is unmaintainable
            now.
          counterfactual_grade_move: In principle yields expected mastery under a move, but only with
            fitted parameters; with none, it reduces to the underlying DAG's reachability analysis.
        requires_learner_data: true
        source_ids:
        - poks-dag-approximation-drops-or
        - bkt-corbett-anderson-needs-fit
        - ecd-dbn-data-requirement
        - lfa-expert-models-improved-by-data
        - teachers-reading-learning-maps
      - candidate: D. Q-matrix / cognitive diagnosis models (DINA, G-DINA, rule space, AHM)
        scores:
          expressiveness_and_or: 3
          time_constrained_sequencing: 1
          teacher_auditability: 2
          maintenance_cost: 1
          counterfactual_grade_move: 1
        justification:
          expressiveness_and_or: DINA is conjunctive (AND) and DINO disjunctive (OR) at the item-attribute
            level (gdina-framework); AHM/HDCM add a DAG over attributes with linear/convergent/divergent
            forms (ahm-adjacency-reachability-qr, ahm-hierarchy-forms-hci, hdcm-attribute-hierarchy-standard)
            but no OR among attribute prerequisites.
          time_constrained_sequencing: The Q-matrix is an item-by-attribute incidence for scoring (tatsuoka-rule-space-origin);
            it carries no durations, grades or ordering beyond the attribute hierarchy, and offers no
            sequencing formulation.
          teacher_auditability: Binary matrices over items and attributes plus slip/guess parameters are
            psychometric artefacts; the reduced Qr matrix is a test blueprint, not a curriculum view (ahm-adjacency-reachability-qr).
          maintenance_cost: A single flipped Q entry biases parameters and misclassifies students (qmatrix-misspecification-fragility);
            any change needs re-estimation on response data and items written for every attribute combination;
            hierarchy validity is a data-driven statistic (HCI > 0.70, HDCM tests).
          counterfactual_grade_move: Nothing about grade placement can be computed; at best the attribute
            DAG gives the same reachability as candidate A.
        requires_learner_data: true
        source_ids:
        - ahm-adjacency-reachability-qr
        - ahm-hierarchy-forms-hci
        - hdcm-attribute-hierarchy-standard
        - qmatrix-misspecification-fragility
        - gdina-framework
        - tatsuoka-rule-space-origin
      - candidate: E. Pure hierarchical ontology / taxonomy (tree, no lateral relations)
        scores:
          expressiveness_and_or: 1
          time_constrained_sequencing: 2
          teacher_auditability: 5
          maintenance_cost: 5
          counterfactual_grade_move: 1
        justification:
          expressiveness_and_or: A tree encodes only containment; no prerequisites at all, let alone AND/OR.
            NGSS Appendix E and CASE-encoded national frameworks are of this form with at most grade-to-grade
            'precedes' chains within a strand (ngss-appendix-e-grade-bands, case-v11-example-counts).
          time_constrained_sequencing: With node weights it is a plain knapsack per grade (weakly NP-hard,
            trivial in practice) but nothing prevents scheduling a dependent before its prerequisite in
            another strand; CPRE documents the resulting overloaded, coverage-driven grade lists (cpre-standards-overloaded-lists).
          teacher_auditability: It is how curricula are already written and read; nested outlines are
            maximally familiar.
          maintenance_cost: Moving a leaf touches one parent pointer; no cross-links to break.
          counterfactual_grade_move: Only budget deltas; it cannot detect violated prerequisites because
            none are represented.
        requires_learner_data: false
        source_ids:
        - ngss-appendix-e-grade-bands
        - case-v11-example-counts
        - cpre-standards-overloaded-lists
        - case-association-types
      - candidate: 'F. Hybrid: typed DAG with AND/OR edge groups + tree overlay + integer time weights
          + optional confidence/provenance (KST-compatible; CASE-exportable)'
        scores:
          expressiveness_and_or: 4
          time_constrained_sequencing: 4
          teacher_auditability: 4
          maintenance_cost: 4
          counterfactual_grade_move: 5
        justification:
          expressiveness_and_or: AND by default (all in-edges), explicit small OR-groups only where pedagogically
            justified, co-requisites as a typed symmetric 'taught_with' relation; this is a restricted
            surmise system whose learning-space closure is well defined (kst-learning-space-axioms, kst-surmise-function-clauses).
            Scores 4 not 5 because OR-groups are intentionally rationed for auditability.
          time_constrained_sequencing: Grade assignment is precedence-constrained knapsack per grade (precedence-knapsack-np-hard)
            encoded with CP-SAT optional intervals, reified precedences and cumulative budget (cpsat-optional-intervals-precedence);
            AND/OR feasibility checks remain linear (andor-feasibility-linear-time). Near-tree sparsity
            keeps it tractable (precedence-structure-complexity-survey).
          teacher_auditability: Teachers navigate via the familiar tree (candidate E strength) and inspect
            typed edges as plain statements, the format they were able to judge in surveys (assistments-teacher-survey-links)
            and use for instruction (teachers-reading-learning-maps); Knewton and DLM show experts author
            such typed graphs without data (knewton-graph-experts-weeks, dlm-learning-map-scale).
          maintenance_cost: Structural edits are local; invariants (acyclic, transitive-reduced, clause-minimal,
            tree-total) are checkable automatically (label-scarcity-active-learning); per-edge provenance/confidence
            records contested links given kappa ~0.6 and 14-56% expert/data agreement (expert-prereq-agreement-kappa,
            carnegie-expert-vs-data-prereqs). No parameters to refit; the optional confidence field is
            dormant until data exist.
          counterfactual_grade_move: Computes violated prerequisites, downstream reachability, per-grade
            budget deltas, re-solved plan, and diff against tree-level grade expectations; supports 'not
            likely one best pathway' (cpre-lp-hypotheses-not-one-path) by re-solving under alternative
            constraints.
        requires_learner_data: false
        source_ids:
