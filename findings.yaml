      framework_profiles:
      - framework: bncc
        minimal_unit_name: habilidade (coded EFnnCIxx, e.g. EF02CI01)
        nesting_levels: 6
        nesting_levels_named:
        - etapa (Ensino Fundamental)
        - área (Ciências da Natureza) / componente curricular (Ciências)
        - ano (1.º–9.º)
        - unidade temática (Matéria e energia; Vida e evolução; Terra e Universo)
        - objeto de conhecimento
        - habilidade
        explicit_prerequisites: false
        progression_between_grades: 'BNCC does not declare prerequisites or links between habilidades;
          it explicitly states the sequential numbering carries no order or hierarchy and that the grouping
          into objetos/unidades is only one possible arrangement. Progression is implicit and must be
          inferred by comparing year tables: it is expressed through more demanding cognitive verbs, more
          sophisticated objetos de conhecimento, or modifiers that widen context from familiar to broader
          settings. The Ciências text adds that habilidades within each unidade temática grow progressively
          in complexity across years, with anos iniciais centred on concrete surroundings and anos finais
          on abstraction and explanatory models. Note nesting_levels counts 6 named levels including etapa;
          excluding etapa gives 5 (area/component, year, unidade temática, objeto de conhecimento, habilidade).'
        source_ids:
        - bncc-unidades-tematicas
        - bncc-nesting-hierarchy
        - bncc-habilidade-code-format
        - bncc-habilidade-sentence-structure
        - bncc-progression-general
        - bncc-progression-ciencias
        - bncc-arranjo-nao-obrigatorio
        - bncc-count-habilidades-per-year
      - framework: ngss
        minimal_unit_name: performance expectation (PE), coded <grade|MS|HS>-<core idea>-<n>, e.g. 3-LS4-2
        nesting_levels: 4
        nesting_levels_named:
        - grade level or grade band (K, 1-5, MS, HS; K-2 / 3-5 for ETS1)
        - domain (PS, LS, ESS, ETS)
        - core idea / DCI arrangement (e.g. LS4, forming the standard title such as 3-LS4)
        - performance expectation (with clarification statement and assessment boundary)
        explicit_prerequisites: true
        progression_between_grades: 'NGSS declares explicit cross-grade dependencies, but at the level
          of DCI elements rather than PE-to-PE: every standard page has an "Articulation of DCIs across
          grade levels" box listing DCI elements that provide a foundation (prior grades, e.g. 2.PS1.A
          for 5-PS1-1) or build on it (later grades, e.g. MS.PS1.A), and the CCSS box marks prerequisite
          math/ELA standards. Within a grade, no ordering or prerequisites are declared and the PE list
          is explicitly not a scope and sequence. Progression is formalized as grade-band endpoints (end
          of grades 2, 5, 8, 12) from the Framework and summarized in Appendix E (DCI, "increasing sophistication
          of student thinking"), Appendix F (practices matrix where each band "builds on" the prior band
          and "progresses to" new capabilities) and Appendix G (CCC progressions with example PEs).'
        source_ids:
        - ngss-three-dimensions
        - ngss-performance-expectation-definition
        - ngss-pe-code-format
        - ngss-foundation-boxes
        - ngss-articulation-box-prerequisites
        - ngss-articulation-example-5-ps1-1
        - ngss-grade-band-endpoints
        - ngss-appendix-e-dci-progressions
        - ngss-appendix-f-sep-progressions
        - ngss-appendix-g-ccc-progressions
        - ngss-pes-not-scope-and-sequence
        - ngss-pe-counts-grades-2-5
