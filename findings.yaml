      - id: co-ebc-structure
        framework: colombia
        topic: structure
        claim: 'Colombia''s Estándares Básicos de Competencias en Ciencias Naturales are set by grupos
          de grados (1-3, 4-5, 6-7, 8-9, 10-11); each group has 3-4 estándares generales and about 60
          "acciones concretas de pensamiento y de producción" in three columns: Me aproximo al conocimiento
          como científico(a) natural; Manejo conocimientos propios de las ciencias naturales (Entorno
          vivo, Entorno físico, Ciencia, tecnología y sociedad); Desarrollo compromisos personales y sociales.'
        detail: 'The MEN document states standards are what students "deben saber y saber hacer una vez
          finalizado su paso por un grupo de grados" and that the actions "no están numeradas, pues ninguna
          de ellas es más importante que las otras, así como tampoco implican un orden". Example 1.°-3.°
          standards: "Me identifico como un ser vivo que comparte algunas características con otros seres
          vivos...", "Reconozco en el entorno fenómenos físicos que me afectan...", "Valoro la utilidad
          de algunos objetos y técnicas...". It describes "coherencia horizontal" (across the three columns)
          and "coherencia vertical" (increasing complexity across grade groups).'
        quote: Las acciones concretas de pensamiento y de producción no están numeradas, pues ninguna
          de ellas es más importante que las otras, así como tampoco implican un orden
        source_title: Estándares Básicos de Competencias en Ciencias Sociales y Ciencias Naturales (MEN,
