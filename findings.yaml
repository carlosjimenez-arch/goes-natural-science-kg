      - id: es-rd157-ciclos-area
        framework: spain
        topic: structure
        claim: Real Decreto 157/2022 organises Educación Primaria in three ciclos of two years and defines
          the area "Conocimiento del Medio Natural, Social y Cultural" (which may be split into Ciencias
          de la Naturaleza and Ciencias Sociales) with competencias específicas common to the stage, and
          criterios de evaluación and saberes básicos set per ciclo.
        detail: 'Art. 3.2: three ciclos of two academic years. Art. 8.1.a): "Conocimiento del Medio Natural,
          Social y Cultural, que se podrá desdoblar en Ciencias de la Naturaleza y Ciencias Sociales".
          Art. 2 defines competencias específicas (desempeños), criterios de evaluación ("referentes que
          indican los niveles de desempeño esperados") and saberes básicos ("conocimientos, destrezas
          y actitudes que constituyen los contenidos propios de un área"). Anexo II gives 9 competencias
          específicas for the area (1 digital devices; 2 plantear y dar respuesta a cuestiones científicas;
          3 resolver problemas a través de proyectos de diseño; 4 propio cuerpo y emociones; 5 características
          de elementos del medio natural, social y cultural; 6 causas y consecuencias de la intervención
          humana; 7 continuidades y cambios del medio social; 8 diversidad e igualdad de género; 9 participar
          en el entorno y la vida social).'
        quote: La Educación Primaria comprende tres ciclos de dos años académicos cada uno
        source_title: Real Decreto 157/2022, de 1 de marzo (BOE-A-2022-3296, texto consolidado)
        source_url: https://www.boe.es/buscar/pdf/2022/BOE-A-2022-3296-consolidado.pdf
        retrieved_at: '2026-09-13'
