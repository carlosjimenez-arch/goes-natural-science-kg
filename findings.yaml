schema_version: research-findings/1.0
research_date_utc: '2026-09-14'
scope: Phase 1 evidence and proposed design implications; no production implementation
methodology:
  source_policy: Primary issuing institutions, original research, author repositories and author-maintained
    technical documentation. Indexed abstracts are identified explicitly.
  retrieved_at_semantics: UTC date on which the cited source text or indexed source excerpt was consulted,
    not publication or original download date.
  confidence_scale:
    high: Directly verified statement or transparent structural reading with adequate access.
    medium: Limited abstract/index access, interpretive comparison, or indirect transfer.
    low: Unverified claim, absence not established, incomplete coverage or unresolved version.
  claim_types:
    source_statement: Reported by the cited primary source.
    interpretation: Researcher inference from cited evidence; not a source quotation.
    proposal: New design or measurement proposal; cited evidence motivates it but does not validate it.
    unverified: Open issue, scoped negative finding or missing verification.
  nesting_convention: Count substantive positions inside a subject; exclude country, document, educational
    stage and grade wrappers. Multiple axes and evidence links are reported separately. Counts are analytical
    readings, not universally declared source metadata.
  scope_limit: Structured framework extraction and selected empirical studies, not an exhaustive systematic
    review or a complete national skill corpus. No prevalence estimates are transported to El Salvador.
  reuse: Brief paraphrases and locator glosses only. No downloaded source corpus is included; citation
    does not imply a corpus redistribution licence.
