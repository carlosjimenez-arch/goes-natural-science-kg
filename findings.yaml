    study_design: Semi-structured interviews; iterative progression construction
    population: Grades 1–4
    sample_size: 44
    limitation: Abstract verified. Cross-sectional patterns are not demonstrated longitudinal transitions,
      a universal ladder, or grade-specific prerequisite probabilities.
  - id: learning.earth_models
    claim_type: source_statement
    statement: Interviews in grades 1, 3 and 5 documented Earth models that combined taught spherical
      language with incompatible everyday assumptions. Correct terminology alone did not establish coherent
      understanding.
