knowledge_structure_evidence:
- id: structure.dag_fact
  claim_type: source_statement
  statement: A directed graph has a topological order exactly when it is acyclic; reachability identifies
    downstream vertices. These mathematical properties do not establish pedagogical validity of an edge.
  source_url:
  - https://algs4.cs.princeton.edu/42digraph/
  retrieved_at: '2026-09-14'
  source_ids:
  - dag
  source_locator:
  - Topological sorting and reachability
  confidence: high
- id: structure.and_correction
  claim_type: interpretation
  statement: 'A prerequisite DAG can already mean AND when every predecessor must be completed. Its limitation
    is not inherently union semantics: alternative prerequisite sets need an explicit interpretation or
    extra rule nodes.'
  source_url:
  - https://algs4.cs.princeton.edu/42digraph/
  - https://aclanthology.org/C08-5001.pdf
  retrieved_at: '2026-09-14'
  source_ids:
  - dag
  - hypergraph
  source_locator:
  - Topological sorting and reachability
  - Directed hypergraphs, derivations and dynamic programming, pp. 9–11
  confidence: high
- id: structure.hypergraph_fact
  claim_type: source_statement
  statement: A directed hyperedge has a tail containing several vertices and a head. Alternative derivations
    can combine required subproblems, providing a formal basis for conjunctive requirement groups and
    alternative routes.
  source_url:
  - https://aclanthology.org/C08-5001.pdf
  retrieved_at: '2026-09-14'
  source_ids:
  - hypergraph
  source_locator:
  - Directed hypergraphs, derivations and dynamic programming, pp. 9–11
  confidence: high
- id: structure.bkt_fact
  claim_type: source_statement
  statement: The original knowledge-tracing work estimates procedural knowledge in an ACT programming
    tutor to support individualized practice. It is a learner-state model, not an authored primary-science
    prerequisite map.
  source_url:
  - https://link.springer.com/article/10.1007/BF01099821
  retrieved_at: '2026-09-14'
  source_ids:
  - bkt
  source_locator:
  - 'Abstract: ACT Programming Tutor and knowledge estimates'
  confidence: medium
- id: structure.poks_fact
  claim_type: source_statement
  statement: The POKS-related 2005 study uses a Bayesian item-dependency model without hidden nodes and
    compares it with IRT on Unix and French response datasets. This is distinct from tracing hidden mastery
    over time.
  source_url:
  - https://journals.sagepub.com/doi/pdf/10.3233/IRG-2005-15%284%2903
  - https://publications.polymtl.ca/71501/
  retrieved_at: '2026-09-14'
  source_ids:
  - poks
  - poks_record
  source_locator:
  - 'Abstract: item dependencies, Unix and French datasets'
  - Bibliographic record
  confidence: medium
- id: structure.probability_limit
  claim_type: interpretation
  statement: Estimated response dependencies do not by themselves identify causal teaching prerequisites
    or predict the effect of moving a curriculum topic to a younger grade.
  source_url:
  - https://link.springer.com/article/10.1007/BF01099821
  - https://journals.sagepub.com/doi/pdf/10.3233/IRG-2005-15%284%2903
  retrieved_at: '2026-09-14'
  source_ids:
  - bkt
  - poks
  source_locator:
  - 'Abstract: ACT Programming Tutor and knowledge estimates'
  - 'Abstract: item dependencies, Unix and French datasets'
  confidence: high
- id: structure.q_fact
  claim_type: source_statement
  statement: A Q-matrix links assessment items to required attributes. Diagnostic inference depends on
    both this mapping and response-model assumptions; identification and Q-matrix accuracy matter.
  source_url:
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC4539161/
  retrieved_at: '2026-09-14'
  source_ids:
  - qmatrix
  source_locator:
  - Q-matrix, DINA, identifiability and estimation sections
  confidence: medium
- id: structure.q_models
  claim_type: interpretation
  statement: DINA provides a conjunctive response rule, DINO a disjunctive one; generalized DINA and multiple-strategy
    models support richer item response structures. These are item-level rules, not scheduling constraints.
  source_url:
  - https://link.springer.com/article/10.1007/s11336-011-9207-7
  - https://wenchao-ma.github.io/GDINA/reference/GDINA-package.html
  retrieved_at: '2026-09-14'
  source_ids:
  - gdina
  - gdina_docs
  source_locator:
  - 'Abstract: general model and constrained special cases'
  - 'Supported models: DINA, DINO, G-DINA and multiple strategies'
  confidence: high
- id: structure.ontology_fact
  claim_type: source_statement
  statement: SKOS distinguishes concepts and semantic broader/narrower/related links. A hierarchy-only
    profile deliberately excludes lateral dependencies; general ontologies need not do so.
  source_url:
  - https://www.w3.org/TR/skos-primer/
  retrieved_at: '2026-09-14'
  source_ids:
  - skos
  source_locator:
  - Concepts, semantic relationships and concept schemes
  confidence: high
- id: structure.time_fact
  claim_type: interpretation
  statement: Scheduling models explicitly represent durations, precedence and resource constraints with
    an objective. A topological ordering alone does not enforce a time budget or choose the best feasible
    plan.
  source_url:
  - https://developers.google.com/optimization/scheduling/job_shop
  - https://algs4.cs.princeton.edu/42digraph/
  retrieved_at: '2026-09-14'
  source_ids:
  - scheduler
  - dag
  source_locator:
  - Precedence, resource exclusion, durations and optimization objective
  - Topological sorting and reachability
  confidence: high
- id: structure.progression_uncertainty
  claim_type: interpretation
  statement: Curricular band endpoints and observed learning paths answer different questions. Scaffolding-dependent
    elementary successes make a universal age-gated prerequisite chain unjustified by this evidence.
  source_url:
  - https://www.nextgenscience.org/sites/default/files/resource/files/Appendix%20F%20%20Science%20and%20Engineering%20Practices%20in%20the%20NGSS%20-%20FINAL%20060513.pdf
  - https://eric.ed.gov/?id=EJ1153957
  - https://journals.sagepub.com/doi/10.1111/j.0956-7976.2004.00737.x
  retrieved_at: '2026-09-14'
  source_ids:
  - ngss_f
  - particles
  - klahr
  source_locator:
  - Eight practice tables and K–2 / 3–5 / 6–8 / 9–12 columns
  - Two rural Midwestern grade 2 classrooms; interviews, artifacts and classroom video
  - N=112, grades 3–4; acquisition and science-fair-poster transfer
  confidence: medium
- id: structure.lp_limits
  claim_type: interpretation
  statement: A two-year study with high-school physics teachers examined learning-progression use. Many
    reported uses did not require assigning a child to one coherent, consistent level. This supports testing
    the intended use of a progression rather than assuming individual-level diagnosis is valid.
  source_url:
  - https://onlinelibrary.wiley.com/doi/full/10.1002/sce.21713
  retrieved_at: '2026-09-14'
  source_ids:
  - lp_teacher
  source_locator:
  - Abstract; model-level assumptions; methods and discussion
  confidence: medium
  transfer_limit: Teacher study in secondary physics; methodological relevance, not direct primary-grade
    efficacy evidence.
- id: structure.lp_uncertainty_model
  claim_type: proposal
  statement: Propose retaining evidence for multiple reasoning patterns across tasks, and only estimating
    distributions over patterns after validation. A learning progression is not itself a Bayesian model,
    and adding probabilities cannot repair an invalid task-to-pattern mapping.
  source_url:
  - https://onlinelibrary.wiley.com/doi/full/10.1002/tea.21336
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC4539161/
  retrieved_at: '2026-09-14'
  source_ids:
  - lp_ecosystems
  - qmatrix
  source_locator:
  - 'Abstract: N=44, grades 1–4, five reasoning patterns and mixed-level responses'
  - Q-matrix, DINA, identifiability and estimation sections
  confidence: medium
knowledge_structure_comparison:
- id: prerequisite_dag
  assessments:
  - id: compare.prerequisite_dag.and_or_corequisites
    claim_type: interpretation
    statement: All incoming hard edges can encode AND. OR requires auxiliary rule nodes or route semantics.
      Reciprocal hard edges cannot represent simultaneous co-learning without creating a cycle.
    source_url:
    - https://algs4.cs.princeton.edu/42digraph/
    retrieved_at: '2026-09-14'
    source_ids: &id001
    - dag
    source_locator:
    - Topological sorting and reachability
    confidence: medium
    criterion: and_or_corequisites
    evaluation_basis: Qualitative engineering assessment; no teacher usability trial, maintenance benchmark
      or local prediction validation was performed.
  - id: compare.prerequisite_dag.time_constrained_sequencing
    claim_type: interpretation
    statement: Good for precedence checks and downstream closure; durations, coverage choices and capacity
      require a separate scheduler.
    source_url:
    - https://algs4.cs.princeton.edu/42digraph/
    retrieved_at: '2026-09-14'
    source_ids: *id001
    source_locator:
    - Topological sorting and reachability
    confidence: medium
    criterion: time_constrained_sequencing
    evaluation_basis: Qualitative engineering assessment; no teacher usability trial, maintenance benchmark
      or local prediction validation was performed.
  - id: compare.prerequisite_dag.teacher_auditability
    claim_type: interpretation
    statement: Short prerequisite chains are easy to explain; a large flat drawing hides the evidence
      and exceptions behind each arrow.
    source_url:
    - https://algs4.cs.princeton.edu/42digraph/
    retrieved_at: '2026-09-14'
    source_ids: *id001
    source_locator:
    - Topological sorting and reachability
    confidence: medium
    criterion: teacher_auditability
    evaluation_basis: Qualitative engineering assessment; no teacher usability trial, maintenance benchmark
      or local prediction validation was performed.
  - id: compare.prerequisite_dag.curriculum_change_maintenance
    claim_type: interpretation
    statement: Relatively simple if dependencies are sparse and stable. Grade-coupled identities or transitively
      materialized edges increase update work.
    source_url:
    - https://algs4.cs.princeton.edu/42digraph/
    retrieved_at: '2026-09-14'
    source_ids: *id001
    source_locator:
    - Topological sorting and reachability
    confidence: medium
    criterion: curriculum_change_maintenance
    evaluation_basis: Qualitative engineering assessment; no teacher usability trial, maintenance benchmark
      or local prediction validation was performed.
  - id: compare.prerequisite_dag.move_grade_4_to_3
    claim_type: interpretation
    statement: Can report backward prerequisites and affected descendants after a placement edit. It cannot
      establish age readiness or estimate learning impact.
    source_url:
    - https://algs4.cs.princeton.edu/42digraph/
    retrieved_at: '2026-09-14'
    source_ids: *id001
    source_locator:
    - Topological sorting and reachability
    confidence: medium
    criterion: move_grade_4_to_3
    evaluation_basis: Qualitative engineering assessment; no teacher usability trial, maintenance benchmark
      or local prediction validation was performed.
