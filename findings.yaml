      - id: on-strands
        framework: ontario
        topic: structure
        claim: 'The Ontario Science and Technology curriculum (2022) has five strands: A. STEM Skills
          and Connections; B. Life Systems; C. Matter and Energy; D. Structures and Mechanisms; E. Earth
          and Space Systems; Strand A is integrated into learning in strands B-E in every grade.'
        detail: 'Each strand B-E has a grade-specific topic (e.g. Grade 2 B Growth and Changes in Animals;
          Grade 3 B Growth and Changes in Plants; Grade 4 B Habitats and Communities; Grade 6 B Biodiversity).
          Strand A has the same three overall expectations in every grade: A1 STEM Investigation and Communication
          Skills; A2 Coding and Emerging Technologies; A3 Applications, Connections, and Contributions.'
        quote: In all grades, learning related to the expectations in Strand A occurs in the context of
          learning related to the other four strands.
        source_title: 'The Ontario Curriculum, Grades 1-8: Science and Technology, 2022 (PDF)'
        source_url: https://assets-us-01.kc-usercontent.com/fbd574c4-da36-0066-a0c5-849ffb2de96e/2674c944-8ede-43d8-aa39-55156a0468ac/The%20Ontario%20Curriculum%20Grades%201%E2%80%938%20%E2%80%93%20Science%20and%20Technology%202022.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: on-expectations-coding
        framework: ontario
        topic: coding
        claim: 'Ontario states two levels of mandated learning per strand: overall expectations (coded
          e.g. B2) and specific expectations (coded e.g. B2.1), where the letter is the strand, the first
          digit the overall expectation and the decimal the specific expectation.'
        detail: '"The specific expectations are organized under numbered subheadings, each of which indicates
          the strand and the overall expectation to which the group of specific expectations corresponds
          (e.g., ''B2'' indicates that the group relates to overall expectation 2 in strand B)." Strands
          B-E each have two overall expectations in grades 1-8: X1 "Relating Science and Technology to
          Our Changing World" and X2 "Exploring and Understanding Concepts". Example Grade 4 B2.1: "describe
          habitats as areas that provide organisms, including plants and animals, with the necessities
          of life, and identify ways in which a local habitat provides these necessities".'
        quote: e.g., "B2" indicates that the group relates to overall expectation 2 in strand B
        source_title: 2022 Science and Technology Grade 4 Overall and Specific Expectations (AODA PDF,
          Ontario Ministry of Education)
        source_url: https://assets-us-01.kc-usercontent.com/fbd574c4-da36-0066-a0c5-849ffb2de96e/885f1ebf-50ff-4a6c-8866-96dba4afbf09/SciTech_G4_AODA.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: on-counts
        framework: ontario
        topic: counts
        claim: Each grade 1-8 has 11 overall expectations (3 in Strand A + 2 in each of B-E); specific
          expectations total about 41 (Grade 2), 44 (Grade 3), 44 (Grade 4), 42 (Grade 5) and 44 (Grade
          6), of which 10 are Strand A.
        detail: 'Parsed from the full PDF text: Strand A always has A1.1-A1.5, A2.1-A2.2, A3.1-A3.3 (10).
          Strands B-E by grade: Grade 2 B7 C9 D7 E8; Grade 3 B11 C6 D9 E8; Grade 4 B9 C10 D7 E8; Grade
          5 B7 C9 D7 E9; Grade 6 B10 C9 D6 E9. Counts may be off by one where a code fell at a page break.'
        quote: Two sets of expectations – overall expectations and specific expectations – are listed
          for each strand
        source_title: 'The Ontario Curriculum, Grades 1-8: Science and Technology, 2022 (PDF)'
        source_url: https://assets-us-01.kc-usercontent.com/fbd574c4-da36-0066-a0c5-849ffb2de96e/2674c944-8ede-43d8-aa39-55156a0468ac/The%20Ontario%20Curriculum%20Grades%201%E2%80%938%20%E2%80%93%20Science%20and%20Technology%202022.pdf
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: on-progression
        framework: ontario
        topic: progression
        claim: Ontario handles progression grade by grade through re-worded and newly introduced specific
          expectations and increasingly complex teacher supports, and explicitly denies that expectation
          numbering implies sequence or dependency.
        detail: '"The specific expectations reflect this progression in skill and knowledge development
          through changes in the wordings of the expectations and through the introduction of new expectations,
          where appropriate. The progression is captured by the increasing complexity of the teacher supports...".
          Also: "This organization is not meant to imply that the expectations in any one group are achieved
          independently of the expectations in the other groups, nor is it intended to imply that learning
          the expectations happens in a linear, sequential way." Skills from early grades "continue to
          be developed and refined" even when no longer explicit.'
        quote: nor is it intended to imply that learning the expectations happens in a linear, sequential
          way
        source_title: 'The Ontario Curriculum, Grades 1-8: Science and Technology, 2022 (PDF)'
        source_url: https://assets-us-01.kc-usercontent.com/fbd574c4-da36-0066-a0c5-849ffb2de96e/2674c944-8ede-43d8-aa39-55156a0468ac/The%20Ontario%20Curriculum%20Grades%201%E2%80%938%20%E2%80%93%20Science%20and%20Technology%202022.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: on-hours
        framework: ontario
        topic: hours
        claim: The Ontario curriculum document prescribes no instructional time for science and technology;
          the 300-minute day is set provincially and boards allocate subject time locally.
        detail: A search of the full 2022 curriculum PDF for 'instructional time', 'minutes per', 'hours
          per' returned nothing. Board guides (e.g. DSBN Elementary Guide to Instructional Time) describe
          1,500 minutes/week and protected time only for mathematics and literacy, with science and technology
          allocated locally; these are board documents, not ministry policy, so the figure is null.
        quote: null
        source_title: 'The Ontario Curriculum, Grades 1-8: Science and Technology, 2022 (PDF)'
        source_url: https://assets-us-01.kc-usercontent.com/fbd574c4-da36-0066-a0c5-849ffb2de96e/2674c944-8ede-43d8-aa39-55156a0468ac/The%20Ontario%20Curriculum%20Grades%201%E2%80%938%20%E2%80%93%20Science%20and%20Technology%202022.pdf
        retrieved_at: '2026-09-13'
