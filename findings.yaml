      - id: adjei-lak2016-abstract
        topic: evidence_reliability
        claim: Adjei, Botelho and Heffernan distinguish causal (true prerequisite) from non-causal skill
          relations and report that a teacher survey about link strength largely confirmed their data-driven
          estimates.
        detail: 'LAK 2016 abstract: prerequisite structures have attracted ''many data-intensive methods
          aimed at refining such structures''; a relationship may be causal (A before B) or non-causal
          (both are prerequisites of a third skill), the latter being co-requisites. The proposed method
          measures pre-to-post-requisite strength and is compared to a teacher-level survey. Abstract
          only (ACM paywall).'
        quote: we compare our results with a teacher-level survey about the strength of the relationships
          of the observed skills and find that the survey results largely confirm our findings
        source_title: Predicting student performance on post-requisite skills using prerequisite skill
          data, S. A. Adjei, A. F. Botelho, N. T. Heffernan, LAK 2016
        source_url: https://api.semanticscholar.org/graph/v1/paper/DOI:10.1145/2883851.2883867?fields=title,abstract,year,authors
