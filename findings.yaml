- id: reasoning.definition
  claim_type: proposal
  statement: 'Proposed task criterion: successful completion must require using observations/data or a
    model to justify an explanation, discriminate alternatives, design a valid test, or transfer an inference.
    Repeating a supplied proposition is insufficient.'
  source_url:
  - https://pirls.bc.edu/timss2023/frameworks/pdf/T23_Frameworks_Ch2_Science.pdf
  - https://www.nextgenscience.org/sites/default/files/resource/files/Appendix%20F%20%20Science%20and%20Engineering%20Practices%20in%20the%20NGSS%20-%20FINAL%20060513.pdf
