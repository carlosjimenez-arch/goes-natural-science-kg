        claim: Since March 2022 the official primary science subject in El Salvador for grades 2-6 is
          "Ciencia y Tecnología", which replaced "Ciencia, Salud y Medio Ambiente".
        detail: The MINED page states the Ministry introduced in March 2022 the resources for the subject
          "Ciencia y Tecnología" for 2.° to 6.° grado "en reemplazo a la asignatura anterior de Ciencia,
          Salud y Medio Ambiente, entrando oficialmente en vigencia en todos los centros educativos del
          país". The page links the current program PDF "Programas de estudio_Ciencia y Tecnología_2.°
          a 6.° grados" (file dated 2025-12-11 in PDF metadata, published under /materiales/2026/), plus
          textbooks (libros de texto 2.°-9.°), cuadernos de trabajo (3.°-9.°) and guías metodológicas
          (2.°-6.°). A III ciclo program (2024) and a Bachillerato program are also linked. The older
          page /programa-de-estudio-cyt/ dates the first version to "Semana 8 (marzo) de la estrategia
          de continuidad educativa 2022".
        quote: introducen en marzo de 2022, los recursos educativos para la asignatura «Ciencia y Tecnología»
          destinados para 2° a 6° grado, en reemplazo a la asignatura anterior de Ciencia, Salud y Medio
