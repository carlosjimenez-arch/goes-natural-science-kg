      - id: sv-cyt-progression
        framework: el_salvador
        topic: progression
        claim: Progression in Ciencia y Tecnología is expressed by grade through three per-grade competencias
          (indagación, creatividad, comunicación) whose verbs escalate from grade 2 to 6, by graded perfiles
          de estudiante, by dominios clave described as bases for later learning, and by indicadores avanzados
          that link to later years; the program declares no formal prerequisite graph between units.
        detail: Section 3.8 shows a 2.°-6.° table of competencias de grado; e.g. Indagación moves from
          "Comparar las propiedades de diferentes objetos de su entorno, para formular sus propias conclusiones"
          (2.°) to "Relacionar las mediciones obtenidas de la manipulación de variables experimentales,
          con principios científicos de referencias bibliográficas" (6.°). Section 3.6 gives coded perfiles
          per grade (2.01 "Observar y cuestionar libremente los fenómenos de su entorno" vs 3.01 "Cuestionar
          libremente los fenómenos de su entorno, incluyendo el por qué y el cómo"). Dominios clave are
          "ideas o principios ... sobre ellos se construirán posteriormente, saberes y procesos más complejos";
          indicadores avanzados "señalan la vía de profundización del contenido o se enlazan directamente
          con el de años posteriores". Section II mentions only a general entry profile (lectoescritura,
          cantidades numéricas) as prerequisite and says contents "se construyen de forma acumulativa".
          The document explicitly says the sequence is orientative and that contenidos conceptuales "no
          son un listado de requisitos a cumplir"; no unit-to-unit prerequisite links are listed anywhere.
        quote: el programa presenta una propuesta orientadora de la secuenciación, lo cual no significa
          que sea rígida. La flexibilidad curricular, siempre enfocada en la búsqueda por articular las
