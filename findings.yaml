      recommendation:
        summary: 'A flat, untyped prerequisite DAG is not the best structure, but the probabilistic and
          psychometric alternatives (BKT/BN, Q-matrix CDMs, full KST learning spaces) are worse for this
          project because every one of them needs learner response data to build, validate or maintain,
          and none is a teacher-facing artefact; with zero interaction data at design time they collapse
          to whatever DAG sits underneath them. The evidence favours a hybrid F: a typed DAG over micro-skills
          (AND semantics by default, a small number of explicit OR-groups modelled as alternative clause
          sets exactly as in KST surmise functions), a strict containment tree overlay that mirrors how
          curricula and CASE frameworks are written and how teachers read them, integer minute weights
          on micro-skills, and per-edge provenance plus an optional confidence field that stays empty
          until data arrive. Sequencing is a precedence-constrained knapsack per grade solved with CP-SAT;
          AND/OR feasibility checks are linear-time, so counterfactual grade moves are cheap. The main
          scientific caveat is that expert prerequisite links are demonstrably noisy (kappa about 0.6;
          14-56% agreement with data at Carnegie Learning), so the structure must treat edges as hypotheses
          with recorded provenance, not facts.'
        structure: 'Nodes: micro_skill (leaf) with fields {id, statement in teacher language, minutes:int,
          evidence_of_mastery text, provenance}; grouping tree via is_child_of: curriculum_strand > specific_skill
          > micro_skill (every micro_skill has exactly one parent; tree is total). Edges: prerequisite_of(src,
          dst, group_id, type in {hard, soft}, provenance, confidence: float|null) where all edges into
          dst with distinct group_id are ANDed and edges sharing a group_id form one OR-alternative clause
          (each group is a KST clause; default is one edge per group = pure AND); taught_with(a, b) symmetric
          co-requisite meaning same grade and adjacent; grade_hint(min_grade, max_grade) optional soft
          bounds from the national curriculum. Invariants enforced on every commit: hard-edge graph acyclic;
          transitive reduction stored; clause minimality (no clause is a superset of another for the same
          node); minutes > 0; tree total and single-parent. Solver: per grade g in 2..6, Boolean x[s,g]
          (skill s placed in grade g), each skill placed exactly once (or optional with penalty for elective
          skills); for each AND-clause set of s, for each clause at least one alternative c has grade(c)
          <= grade(s), and for hard AND edges grade(c) <= grade(s) with equality allowed only if taught_with
          or ordered within the grade by a secondary sequencing pass; sum over s of minutes[s]*x[s,g]
          <= 160*60 minus fixed overhead per grade; objective: minimise deviation from grade_hints plus
          total lateness of strand coverage, tie-break by balancing minutes across grades; second pass
          orders skills within a grade by topological sort with taught_with adjacency. Export: CASE JSON
          with isChildOf for the tree, precedes for hard edges, ext:prerequisiteGroup for OR clauses,
          ext:minutes for weights.'
        what_it_cannot_do:
        - Predict mastery, learning rates or the effect of a grade move on student outcomes; that requires
          BKT/BN parameters fitted to interaction data that do not exist.
        - Validate that its prerequisite edges are true; without response data the map is an expert hypothesis
          whose link-level reliability is expected to be moderate (kappa about 0.6; 14-56% agreement with
          data in prior work).
        - Represent the full KST learning space (alternative learning paths at item level) or the states
          occurring in a real population; it stores only a surmise-style clause structure.
        - Serve as a psychometric scoring model (no Q-matrix, no item bank); diagnostic assessment would
          need a separate item-to-micro-skill mapping later.
        - Guarantee tractability if OR-groups proliferate; mixed AND/OR optimisation is NP-hard even in
          restricted cases, so OR-groups must be rationed.
        - Encode three-dimensional NGSS-style integration (practices, crosscutting concepts) beyond tags
          on nodes; the tree is single-parent by design.
        rejected_alternatives_and_why:
        - 'A. Untyped flat DAG: cannot express OR alternatives or co-requisites, and a flat graph of several
          hundred micro-skills without a tree overlay is hard for teachers to navigate; it is a strict
          subset of F.'
        - 'B. Pure hypergraph/AND-OR graph as the primary artefact: maximal expressiveness but experts
          are unreliable at multi-item (OR) judgments (ALEKS QUERY experience), diagrams with hyperedges
          are harder to audit, and optimisation hardness rises; F keeps OR-groups but confines them.'
        - 'C. BKT / POKS / Bayesian nets: all parameters require learner data (1,450 students for a single
          LP DBN; tens of thousands of steps for LFA); no time-budget semantics; CPTs are not teacher-auditable;
          POKS itself degenerates to a DAG.'
        - 'D. Q-matrix / DINA / G-DINA / AHM: scoring models over items, not curricula; single-entry Q-matrix
          errors bias parameters and misclassify students; attribute hierarchies are DAGs anyway, so D
          adds fragility without adding sequencing power.'
        - 'E. Pure tree: maximally auditable and maintainable but encodes no prerequisites, so it cannot
          detect violated dependencies or answer counterfactuals; it reproduces the overloaded, coverage-driven
          standards CPRE criticises. Retained only as the overlay inside F.'
        - 'Full KST learning space (ALEKS-style): requires thousands of expert queries plus thousands
          of students per year to prune false states and monitor validity; state spaces reach hundreds
          of thousands; unmaintainable for a curriculum team without an assessment stream.'
        open_questions:
        - No published benchmark was located for CP-SAT on precedence-constrained knapsack/grade-assignment
          at n≈500 skills and 5 grades; tractability should be verified empirically on the real graph
          (expected easy for sparse near-tree graphs, but unproven here).
        - Which grain size for micro_skill minimises inter-rater disagreement? Learning-progression research
          operates at coarse big-idea levels and found wide within-grade variation; the reliability of
          expert links at fine grain in primary science is not measured in the literature found.
        - How should co-requisites (taught_with) interact with the budget when both skills straddle a
          grade boundary? Treat as merged super-node or as soft adjacency penalty.
        - Whether to encode NGSS-style practices and crosscutting concepts as tags (many-to-many) or as
          a second tree; single-parent containment simplifies audit but loses the three-dimensional integration
          NGSS insists on.
        - What minimum evidence (e.g., two independent expert raters plus documented rationale) should
          be required before an edge is marked 'hard' rather than 'soft', given kappa about 0.6 in pairwise
          prerequisite labelling?
        - Gillies & Liu (1995) and Lenstra & Rinnooy Kan (1978) original texts were paywalled; their results
          are cited here through secondary sources (IPEC 2025 survey, Prot & Bellenguez survey).
        - The Corbett & Anderson (1995) original was not accessible; BKT characterisation relies on the
          Pavlik et al. 2013 review.
    learning_science:
      findings:
      - id: misconception-plants-eat-soil
        topic: misconceptions
        domain: biology / plants / photosynthesis
        age_range: 5-10
        claim: Elementary children commonly believe plants get their food from the soil through their
          roots and that soil or fertilizer is the plant's food.
        detail: A curated misconceptions list (grounded in Barman et al. 2006 and Keeley et al. probes)
          reports that K-4 children think plants take in all substances they need through their roots,
          that soil is both support and food source, that sunlight is beneficial but not essential and
          provides warmth rather than energy, and that plants need 'plant food' (fertilizer) to survive.
          The belief that plants absorb food from the environment rather than making it internally is
          among the most persistent findings in plant-biology misconception research.
        quote: Plants take in all substances they need to grow through their roots
        source_title: Common Misconceptions about Plants (Beyond Penguins and Polar Bears, Ohio State
          University; citing Barman et al. 2006; Keeley, Eberle & Farrin 2005; Keeley et al. 2007, 2008)
        source_url: https://beyondpenguins.ehe.osu.edu/issue/polar-plants/common-misconceptions-about-plants
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: misconception-earth-shape-synthetic-models
        topic: misconceptions
        domain: Earth and space / Earth shape and gravity
        age_range: 6-11
        claim: Children in grades 1-5 hold alternative mental models of the Earth (flat, hollow sphere,
          dual Earth) and gradually modify them toward the spherical model.
        detail: Vosniadou and Brewer interviewed 60 elementary students in grades 1, 3 and 5 about the
          shape of the Earth. Children appear to hold internally consistent initial models and, during
          knowledge acquisition, modify them to make them more consistent with the culturally accepted
          model, producing 'synthetic' models such as a hollow sphere with people inside or a dual Earth.
          This is the classic evidence base for the misconception that people could fall off a spherical
          Earth and that 'down' is absolute.
        quote: children appear to modify their initial models to make them more consistent with the culturally
          accepted model
        source_title: 'Mental Models of the Earth: A Study of Conceptual Change in Childhood, Vosniadou
          & Brewer, Cognitive Psychology, 1992 (ERIC EJ455189)'
        source_url: https://eric.ed.gov/?q=Vosniadou+Brewer+%22Mental+Models+of+the+Earth%22
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: misconception-day-night-sun-hides
        topic: misconceptions
        domain: Earth and space / day-night cycle
        age_range: 9-16
        claim: Children explain day and night with a progression of notions (the Sun goes behind hills,
          clouds cover the Sun, the Sun goes behind the Earth, the Earth goes around the Sun once a day)
          before reaching Earth rotation.
        detail: 'Baxter (1989) identified six ideas about day and night through which students tend to
          move with age: the Sun goes behind hills; clouds cover the Sun; the Moon covers the Sun; the
          Sun goes behind the Earth once a day; the Earth goes around the Sun once a day; the Earth spins
          on its axis once a day. Additional common ideas are that the Sun moves across the sky and that
          the Earth rotates clockwise.'
        quote: The Sun goes behind the Earth once a day
        source_title: 'Common Misconceptions about Day and Night, Seasons (Beyond Penguins and Polar Bears,
          OSU; citing Baxter 1989, International Journal of Science Education 11: 502-513)'
        source_url: https://beyondpenguins.ehe.osu.edu/issue/polar-patterns-day-night-and-seasons/common-misconceptions-about-day-and-night-seasons
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: misconception-seasons-distance
        topic: misconceptions
        domain: Earth and space / seasons
        age_range: 8-14
        claim: Children (and many adults) believe seasons are caused by the Earth being closer to the
          Sun in summer and farther in winter, and that seasons occur at the same time everywhere.
        detail: The same secondary synthesis lists the distance-to-Sun explanation, 'seasons happen at
          the same time everywhere on Earth', and 'seasonal characteristics and change are the same everywhere
          on Earth' as the main documented misconceptions about seasons in elementary students, alongside
          the Baxter day-night sequence.
        quote: Earth is closer to the Sun during summer and farther away during winter.
        source_title: Common Misconceptions about Day and Night, Seasons (Beyond Penguins and Polar Bears,
          OSU; citing Baxter 1989)
        source_url: https://beyondpenguins.ehe.osu.edu/issue/polar-patterns-day-night-and-seasons/common-misconceptions-about-day-and-night-seasons
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: misconception-moon-phases-third-grade
        topic: misconceptions
        domain: Earth and space / phases of the Moon
        age_range: 8-9
        claim: Third graders hold non-scientific ideas about lunar phases (e.g., clouds or Earth's shadow
          cause phases) but are capable of conceptual change with targeted instruction.
        detail: Stahly, Krockover and Shepardson examined third-grade students' ideas about the lunar
          phases before and after an instructional period designed to promote conceptual change and demonstrated
          that students of this age are capable of making conceptual changes. The paper is the standard
          citation for elementary-age Moon-phase misconceptions and for the feasibility of addressing
          them in grade 3.
        quote: Examines third-grade students' ideas on the lunar phases prior to, and following, an instructional
          period designed to promote students' conceptual change.
        source_title: Third Grade Students' Ideas about the Lunar Phases, Stahly, Krockover & Shepardson,
          Journal of Research in Science Teaching, 1999 (ERIC EJ582614)
        source_url: https://eric.ed.gov/?id=EJ582614
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: misconception-heat-temperature-substance
        topic: misconceptions
        domain: physics / energy, heat vs temperature
        age_range: 6-13
        claim: Children aged 6-13 conceive of heat (and cold) as a substance contained in objects and
          do not differentiate heat from temperature.
        detail: Erickson's interview study with children aged 6 to 13 identified stable patterns of belief
          about heat and temperature, including heat as a material-like entity that accumulates in objects
          and 'cold' as a separate substance. The paper is the foundational source for the heat/temperature
          misconception in the Driver et al. syntheses.
        quote: interviews with children ranging in age from 6 to 13 to identify patterns of children's
          beliefs in the area of heat and temperature
        source_title: Children's Conceptions of Heat and Temperature, Erickson, Science Education 63(2),
          1979 (ERIC EJ201971)
        source_url: https://eric.ed.gov/?id=EJ201971
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: misconception-sound-heat-as-material
        topic: misconceptions
        domain: physics / sound and heat
        age_range: '8'
        claim: Eight-year-olds attribute material properties (substantiality, weight, permanence) to sound
          and heat, abandoning them in a fixed order (permanence, then weight, then substantiality).
        detail: Eighty-three 8-year-old children were interviewed to see whether they attributed properties
          of objects or of physical processes to sound and heat. Children assigned material characteristics
          hierarchically, with heat receiving more material attributions than sound; five mental models
          about substantiality were identified, each tied to a naive theory, and conceptual development
          progressed gradually across frameworks. This supports treating 'sound is a thing that travels/gets
          used up' as a documented primary-age misconception.
        quote: Eighty-three 8-year-old children were interviewed individually
        source_title: Is Children's Naive Knowledge Consistent? A Comparison of the Concepts of Sound
          and Heat, Lautrey & Mazens, Learning and Instruction, 2004 (ERIC EJ731632)
        source_url: https://eric.ed.gov/?id=EJ731632
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: misconception-force-impetus
        topic: misconceptions
        domain: physics / force and motion
        age_range: null
        claim: The most-cited student misconception about forces is an 'impetus' force inside a moving
          object that keeps it moving and fades away, although its prevalence in drawings may be lower
          than assumed.
        detail: Robertson et al. note that the impetus force is 'perhaps the most commonly cited student
          idea about forces in the literature' and question how often students actually draw such a force.
          Alonzo and Steedle's force-and-motion learning progression (see inquiry_progression finding)
          places such ideas at lower levels. Age-specific prevalence for 7-12-year-olds was not available
          in the fetched sources.
        quote: belief that there is a force inside a moving object that keeps it going and causes it to
          have some speed
        source_title: Impetus-Force-Like Drawings May Be Less Common than You Think, Robertson et al.,
          2022 (ERIC EJ1337174)
        source_url: https://eric.ed.gov/?id=EJ1337174
        retrieved_at: '2026-09-13'
        confidence: low
      - id: misconception-light-vision-emission
        topic: misconceptions
        domain: physics / light and sight
        age_range: 13-22
        claim: Students at all educational levels hold misconceptions about how sight works, including
          that the eyes send something to the object or that light is not needed for seeing.
        detail: A cross-age study (30 eighth graders, 26 eleventh graders, 42 student teachers) coded
          sight models such as 'eyes see the object', 'object sends out light to the eyes', and 'light
          travels to the eyes, then the eyes reflect the light to an object'. Common misconceptions about
          light, light sources and the sight process were found at all levels. The sample starts at grade
          8, so prevalence for ages 7-12 is inferred from the literature the paper reviews (Guesne 1985).
        quote: Some common misconceptions about light, light sources and sight process have been determined
          at all levels.
        source_title: A cross-age study of an understanding of light and sight concepts in physics, Uzun,
          Alev & Karal, Science Education International 24(2), 2013
        source_url: https://files.eric.ed.gov/fulltext/EJ1015829.pdf
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: misconception-electricity-clashing-currents
        topic: misconceptions
        domain: physics / electricity, simple circuits
        age_range: 10-12
        claim: One third to over half of 10-12-year-olds explain a lit bulb with a 'clashing currents'
          model in which two currents leave the battery terminals and meet in the bulb.
        detail: Métioui, Baulu MacWillie and Trudel gave a 60-minute paper-and-pencil questionnaire to
          237 pupils aged 10-12 in Canada, France and Morocco. On the question about current flow, 33%
          (Casablanca), 35% (Clare), 41% (Montreal) and 57% (Poitiers) chose the antagonistic-currents
          model; only 27-52% used the scientific model, and many failed the charge-conservation question.
          The authors conclude that these conceptions are universal across cultures and languages.
        quote: an important number of pupils (Casablanca 33%, region of Clare 35%, Montreal 41%, and Poitiers
          57%) refer to the model of antagonistic currents
        source_title: Conceptions of pupils of the primary on the topic of an electric circuit in three
          countries (Canada, France and Morocco), Métioui, Baulu MacWillie & Trudel, European Journal
          of Science and Mathematics Education 4(4), 2016
        source_url: https://files.eric.ed.gov/fulltext/EJ1118155.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: misconception-matter-particles-local-frameworks
        topic: misconceptions
        domain: chemistry / matter and particles
        age_range: 6-10
        claim: Before instruction, young children build local, substance-specific frameworks about the
          make-up of matter rather than a general particulate model.
        detail: Nakhleh and Samarapungavan investigated 15 young children's spontaneously constructed
          understanding of the particulate nature of matter prior to formal instruction. They propose
          that children first develop local frameworks particular to different classes of substances and
          only slowly expand them to a wide range of substances and properties. Smith, Wiser, Anderson
          and Krajcik's matter learning progression (see inquiry_progression) formalises the K-8 route
          from macroscopic to atomic-molecular reasoning.
        quote: children first develop local frameworks particular to different classes of substances
        source_title: Elementary School Children's Beliefs about Matter, Nakhleh & Samarapungavan, Journal
          of Research in Science Teaching, 1999 (ERIC EJ592106)
        source_url: https://eric.ed.gov/?id=EJ592106
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: misconception-living-things-movement-criterion
        topic: misconceptions
        domain: biology / living vs non-living
        age_range: 6-15
        claim: Children frequently classify plants as non-living and use movement as the key criterion
          for being alive, with incorrect classifications persisting across ages 6-15.
        detail: Stavy and Wax surveyed Israeli children aged 6-15 with interviews and questionnaires on
          classifying animals, plants and inanimate objects and found a high percentage of incorrect classifications
          of plants at all ages, with no consistent link between living/non-living classification and
          biological criteria. Zogza and Papamichael (ERIC EJ658246) show preschoolers use the criterion
          of movement to decide whether plants are living.
        quote: there was a high percentage of incorrect classifications of plants at all ages
        source_title: Children's Conceptions of Plants as Living Things, Stavy & Wax, 1987 (ERIC ED294732)
        source_url: https://eric.ed.gov/?id=ED294732
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: misconception-animal-classification-persistent
        topic: misconceptions
        domain: biology / animal classification
        age_range: 10-22
        claim: Alternative conceptions in animal classification (e.g., restricting 'animal' to mammals,
          misclassifying insects, fish and humans) remain largely intact throughout the school years.
        detail: Trowbridge and Mintzes examined the extent to which students' alternative conceptions
          about animal classification changed as a function of age and report that many alternative views
          remain intact throughout the school years, recommending neoconstructivist teaching approaches
          that confront these ideas directly.
        quote: many alternative views remain intact throughout the school years
        source_title: 'Alternative Conceptions in Animal Classification: A Cross-Age Study, Trowbridge
          & Mintzes, Journal of Research in Science Teaching, 1988 (ERIC EJ380959)'
        source_url: https://eric.ed.gov/?id=EJ380959
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: misconception-digestion-structure-function
        topic: misconceptions
        domain: biology / human body, digestion
        age_range: 4-10
        claim: Children aged 4-10 have partial conceptions of the digestive system (food goes to the stomach
          and stays or disappears; no connection to blood) even though biological knowledge is an independent
          domain from age four.
        detail: Teixeira described conceptions of the structure and function of the human digestive system
          in 45 children aged 4-10, finding that children possess biological knowledge as an independent
          domain from age four and identifying barriers to acquiring the scientific concepts (e.g., linking
          digestion to absorption and transport).
        quote: children possess biological knowledge as an independent knowledge domain from the age of
          four
        source_title: What Happens to the Food We Eat? Children's Conceptions of the Structure and Function
          of the Digestive System, Teixeira, International Journal of Science Education, 2000 (ERIC EJ608704)
        source_url: https://eric.ed.gov/?id=EJ608704
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: misconception-adaptation-teleological
        topic: misconceptions
        domain: biology / evolution and adaptation
        age_range: 5-8
        claim: Misconceptions about adaptation (as need-driven, intentional change) are rooted in preschool
          cognitive biases, yet 5-8-year-olds can learn a population-based mechanism of natural selection
          from a storybook intervention and retain it for 3 months.
        detail: Kelemen et al. note that adaptation by natural selection is one of the most widely misunderstood
          processes and that misconceptions are rooted in cognitive biases found in preschoolers, becoming
          entrenched before adolescence when the topic is usually taught. Two experiments with 5- to 8-year-olds
          using a custom picture storybook showed children understood and generalised the population-based
          logic, with learning enduring 3 months later.
        quote: Misconceptions are rooted in cognitive biases found in preschoolers, yet concerns about
          complexity mean that adaptation by natural selection is generally not comprehensively taught
          until adolescence.
        source_title: Young children can be taught basic natural selection using a picture-storybook intervention,
          Kelemen, Emmons, Seston Schillaci & Ganea, Psychological Science, 2014
        source_url: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=AUTH%3A%22Kelemen%20D%22%20AND%20TITLE%3A%22natural%20selection%22&format=json&resultType=core
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: misconception-ecosystems-carbon-macroscopic
        topic: misconceptions
        domain: biology / ecosystems, food chains, carbon cycle
        age_range: 9-18
        claim: Upper-elementary students reason about ecosystems and carbon cycling in terms of macroscopic
          events (plants grow, animals eat) without tracing matter, and few even high school students
          reach the level national standards expect.
        detail: Mohan, Chen and Anderson developed a four-level learning progression for carbon cycling
          in socio-ecological systems from interviews and assessments spanning upper elementary through
          high school. Younger learners perceived a world where events occurred at a macroscopic scale;
          only the highest level traces matter through hierarchically organised systems using chemical
          models, and few high-school students consistently reached it.
        quote: Younger learners perceived a world where events occurred at a macroscopic scale
        source_title: Developing a Multi-Year Learning Progression for Carbon Cycling in Socio-Ecological
          Systems, Mohan, Chen & Anderson, Journal of Research in Science Teaching, 2009 (ERIC EJ850694)
        source_url: https://eric.ed.gov/?id=EJ850694
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: misconception-water-cycle-evaporation
        topic: misconceptions
        domain: Earth science / water cycle and states of matter
        age_range: 5-15
        claim: Children from kindergarten to grade 9 explain clouds and rain without evaporation (e.g.,
          clouds are bags of water, rain falls when clouds get heavy or collide); understanding evaporation
          is a prerequisite for a condensation-based rain mechanism.
        detail: Bar described Israeli children's (K-9) explanations of the water cycle, including their
          views of the source of clouds and the mechanism of rainfall, and concluded that understanding
          evaporation is a necessary condition for explaining a mechanism of rain that includes condensation
          and heaviness.
        quote: understanding evaporation is a necessary condition for explaining a mechanism of rain containing
          the ideas of condensation and heaviness
        source_title: Children's Views about the Water Cycle, Bar, Science Education, 1989 (ERIC EJ394281)
        source_url: https://eric.ed.gov/?id=EJ394281
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: misconception-weather-climate-review
        topic: misconceptions
        domain: Earth science / weather vs climate
        age_range: 5-14
        claim: A literature review documents children's naive ideas about weather, climate and the atmosphere
          (e.g., conflating weather with climate, clouds made of cotton/smoke) side by side with accepted
          explanations.
        detail: Henriques' review synthesises existing research on children's misconceptions relating
          to weather, climate and the atmosphere, presenting scientifically accepted interpretations in
          tandem with children's naive ideas. Specific prevalence data by age were not in the abstract.
        quote: Reports a synthesis of existing research on children's misconceptions relating to weather,
          climate, and the atmosphere.
