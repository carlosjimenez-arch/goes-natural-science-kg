supplementary_evidence:
  schema_note: 'Independent second research pass (2026-09-13). Records keep their own shape: each has
    id, claim, detail, optional quote, source_title, source_url, retrieved_at and confidence (high = read
    in the fetched primary source; medium = official secondary source or abstract only; low = unverified).
    This section supplements, and does not replace, the sections above; decisions/0001 cites the sections
    above only.'
  sections:
    international_assessment_frameworks:
      findings:
      - id: pisa-source-version
        framework: pisa
        topic: source
        claim: The latest fetchable PISA science framework is the OECD "PISA 2025 Science Framework (Second
          Draft)" PDF, plus its HTML companion site; no 2015/2018 fallback was needed.
        detail: The 93-page PDF is hosted by OECD at pisa-framework.oecd.org and is labelled "PISA 2025
          SCIENCE FRAMEWORK (SECOND DRAFT)" on every page. The HTML site organises it into sections Overview,
          What's new, Science competencies, Environmental science competencies, Scientific knowledge,
          Science identity, Contexts, Examples. The framework states it defines "the outcomes of science
          education for 15-year-olds" and replaces the older single "scientific literacy" construct with
          a broader set of outcomes.
        quote: The PISA 2025 framework shifts to one which is broader. The focus of the document is now
          on the general outcomes of science education.
        source_title: PISA 2025 Science Framework
        source_url: https://pisa-framework.oecd.org/science-2025/
        retrieved_at: '2026-09-13'
        confidence: high
      - id: pisa-competencies
        framework: pisa
        topic: competencies
        claim: PISA 2025 defines exactly three scientific competencies, each framed as an action.
        detail: Competency 1 is "Explain phenomena scientifically"; Competency 2 is "Construct and evaluate
          designs for scientific enquiry and interpret scientific data and evidence critically"; Competency
          3 (new in 2025) is "Research, evaluate and use scientific information for decision making and
          action". Table 1 lists them as the "Competencies" component alongside Contexts, Knowledge and
          Science Identity. A subset of three "environmental science competencies" (agency in the Anthropocene)
          is also defined.
        quote: all these competencies are framed as actions. They are written in this manner to convey
          what a scientifically educated person should both understand and be capable of doing.
        source_title: PISA 2025 Science Framework (Second Draft), Section 4 Organisation of the Domain,
          Boxes 3-5
        source_url: https://pisa-framework.oecd.org/science-2025/assets/docs/PISA_2025_Science_Framework.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: pisa-competency-1-abilities
        framework: pisa
        topic: competencies
        claim: Competency 1 "Explain phenomena scientifically" is decomposed into six numbered abilities
          in Box 3.
        detail: The abilities are (1) recall and apply appropriate scientific knowledge; (2) use different
          forms of representations and translate between these forms; (3) make and justify appropriate
          scientific predictions and solutions; (4) identify, construct, and evaluate models; (5) recognise
          and develop explanatory hypotheses of phenomena in the material world; (6) explain the potential
          implications of scientific knowledge for society.
        quote: 'Produce and evaluate explanations and solutions for a range of natural and technological
          phenomena and problems demonstrating the ability to: 1. Recall and apply appropriate scientific
          knowledge'
        source_title: PISA 2025 Science Framework (Second Draft), Box 3
        source_url: https://pisa-framework.oecd.org/science-2025/assets/docs/PISA_2025_Science_Framework.pdf
