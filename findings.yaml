      - id: lfa-expert-models-improved-by-data
        topic: evidence_reliability
        claim: Expert-engineered knowledge-component models often ignore distinctions that matter for
          novices; Learning Factors Analysis discoveries, when fed back into a tutor, produced significant
          learning gains, but this loop requires tens of thousands of logged student steps.
        detail: Liu and Koedinger (JEDM 2017) write that traditional expert methods 'are also subjective,
          and prior research has shown that expert-engineered cognitive models often ignore content distinctions
          that are important for novice learners'. They validate an LFA-discovered KC split on a dataset
          of 72,404 student problem steps and show a classroom redesign yields significant gains over
          control. Design-time curricula cannot run this loop; the structure must therefore be built to
          be refinable later.
        quote: prior research has shown that expert-engineered cognitive models often ignore content distinctions
          that are important for novice learners
        source_title: 'Closing the loop: Automated data-driven cognitive model discoveries lead to improved
          instruction and learning gains, R. Liu, K. R. Koedinger, JEDM 9(1), 2017'
        source_url: https://files.eric.ed.gov/fulltext/EJ1155896.pdf
