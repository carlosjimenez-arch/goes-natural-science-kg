        claim: Element interactivity (how many information elements must be processed simultaneously)
          defines intrinsic load and also underlies extraneous load, so sequencing should reduce simultaneous
          interacting elements for novices.
        detail: 'Sweller proposes that element interactivity underlies both intrinsic and extraneous cognitive
          load, distinguished by whether the interactivity is essential to the task or a product of instructional
          procedures; germane load is then defined via intrinsic load. Design implication: isolate elements
