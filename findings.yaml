learning_science:
  empirical_evidence:
  - id: learning.ecosystem_patterns
    claim_type: source_statement
    statement: Interviews with 44 students in grades 1–4 yielded five ecosystem-reasoning patterns, ranging
      from human-like intentions and practical accounts to increasingly complex causal explanations. Many
      responses combined patterns from several proposed levels.
    source_url:
    - https://onlinelibrary.wiley.com/doi/full/10.1002/tea.21336
    retrieved_at: '2026-09-14'
