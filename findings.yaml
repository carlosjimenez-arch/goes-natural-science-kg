      - id: pisa-no-prerequisites-progression
        framework: pisa
        topic: prerequisites-progression
        claim: PISA 2025 declares no explicit prerequisite relations between competencies or knowledge
          areas; progression is handled via a single age target (15-year-olds) and a described proficiency
          scale, not via grade sequencing.
        detail: 'The framework repeatedly limits content to "the knowledge that 15-year-old students can
          reasonably be expected to have" and does not specify what precedes what. It acknowledges "there
          exists a hierarchy of progression which should be attended to when formulating items" (para
          75) but does not enumerate it. Progression is operationalised through proficiency-level descriptors
          (Levels 1c, 1b, 1a, 2-6) on the reporting scale, which use cognitive-demand wording (e.g. Level
          1b: "at the lowest level of cognitive demand"), and through the Low/Medium/High cognitive demand
          dimension. Since PISA is age-based and single-point, nothing is said about grades 2-8.'
