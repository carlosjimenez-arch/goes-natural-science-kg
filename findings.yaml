  - ngss_f
  source_locator:
  - Chapter 2, printed pp. 19–45; grade 4 tables pp. 20–22
  - Eight practice tables and K–2 / 3–5 / 6–8 / 9–12 columns
  confidence: medium
  review_question: Can a child earn full credit by reproducing a taught sentence without using the task
    evidence? If yes, do not classify those points as reasoning.
- id: reasoning.scoring
  claim_type: proposal
  statement: Proposed analytic scoring separates content accuracy, evidence selection and the inferential
    link. Extended justification may address a rival account, limitation or new-context prediction; missing
    these is not automatically failure on simpler reasoning tasks.
