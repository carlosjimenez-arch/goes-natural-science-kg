      - id: ngss-articulation-box-prerequisites
        framework: ngss
        topic: prerequisites
        claim: NGSS declares explicit cross-grade dependencies at the DCI-element level through the "Articulation
          of DCIs across grade levels" connection box, which lists foundational (prior) and building-on
          (later) DCI elements.
        detail: 'How to Read NGSS defines the box: "This box contains the names of DCIs that either 1)
          provide a foundation for student understanding of the core ideas in this performance expectation
          (usually at prior grade levels) or 2) build on the foundation provided by the core ideas in
          this performance expectations (usually at subsequent grade levels)." The targets are DCI elements
          (e.g. 2.PS1.A, MS.PS1.A), not PE codes, so prerequisites are declared between DCI elements/grade-levels
          rather than between individual PEs. The CCSS connection box additionally marks "pre-requisite
          or connected" Common Core standards, with italics meaning not prerequisite.'
        quote: provide a foundation for student understanding of the core ideas in this performance expectation
          (usually at prior grade levels) or 2) build on the foundation provided
        source_title: How to Read the Next Generation Science Standards (PDF)
        source_url: https://www.nextgenscience.org/sites/default/files/resource/files/How%20to%20Read%20NGSS%20-%20Final%2008.19.13.pdf
        retrieved_at: '2026-09-13'
