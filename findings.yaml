        confidence: medium
      measurable_criteria_proposal:
      - criterion: Share of micro-skills (and of allocated instructional minutes) per grade whose task_demand
          is coded Reasoning (TIMSS) or DOK >= 3
        operationalisation: 'Tag each micro-skill with a controlled vocabulary of TIMSS behaviours: knowing
          = {recall, recognize, describe, provide_examples}; applying = {compare, contrast, classify,
          relate, use_model, interpret_information, explain_familiar}; reasoning = {analyze, synthesize,
          hypothesize, predict, design_investigation, evaluate, draw_conclusion, generalize, justify}.
          Assign DOK 1-4 in parallel using the rule ''what comes after the verb'': DOK1 single right answer/recall;
          DOK2 apply one or two concepts, one right answer; DOK3 requires evidence, justification, planning,
          non-routine or multiple valid answers; DOK4 multi-lesson investigation/design. A script computes
          reasoning_share = minutes(reasoning or DOK>=3) / total minutes per grade, plus knowing/applying/reasoning
          proportions. Flag any micro-skill whose verb is ''explain'' but whose context is familiar as
          applying, not reasoning.'
        evidence_ids:
        - rvr-timss-cognitive-domains-behaviours
        - rvr-timss-target-percentages
        - rvr-webb-dok-levels
        - rvr-dok-verbs-warning
        - rvr-pisa-cognitive-demand-levels
        - rvr-naep-grade4-practice-distribution
        suggested_threshold: '>= 20% reasoning (TIMSS) or DOK>=3 in grades 2-4, rising to >= 30% in grades
          5-6; and <= 40% pure Knowing/DOK1 at any grade'
        caveats: TIMSS percentages are assessment-time targets for tests, not curriculum time; verbs alone
          misclassify (PISA and Webb both warn difficulty != demand). Coding requires two independent
          raters on a sample to check inter-rater agreement before scripting.
      - criterion: Cognitive demand of each task coded Low/Medium/High per PISA 2025 four-factor rule,
          with a target distribution by grade
        operationalisation: 'For each task record four attributes: n_elements (number of knowledge elements
          that must be related: 1 / 2 / >2), familiarity (familiar / unfamiliar context), operation (recall
          / apply-explain / analyse-evaluate-justify-plan), model_dependence (none / uses standard model
          / requires abstract model). Demand = Low if n_elements=1 and operation=recall; High if operation
          in {analyse, evaluate, justify, plan} and (n_elements>2 or unfamiliar or model_dependence=abstract);
          else Medium. Report the L/M/H histogram per grade and per science domain.'
        evidence_ids:
        - rvr-pisa-cognitive-demand-levels
        - rvr-pisa-epistemic-knowledge
        - cls-sweller-element-interactivity
        suggested_threshold: 'Grades 2-3: >= 25% Medium, >= 5% High; Grades 4-6: >= 35% Medium, >= 15%
          High; Low <= 50% at every grade'
        caveats: PISA thresholds were written for 15-year-olds; the proposed grade bands are extrapolations.
          High-demand tasks for 7-8-year-olds should still keep element interactivity low (few simultaneous
          ideas) to avoid overload.
      - criterion: Procedural vs epistemic coverage of inquiry micro-skills (PISA distinction)
        operationalisation: Each inquiry micro-skill gets knowledge_type in {content, procedural, epistemic}.
          Procedural = can perform (e.g., 'keeps all but one variable the same'); epistemic = can explain
          why the procedure warrants a claim (e.g., 'explains why repeating measurements makes the result
          more trustworthy'; 'distinguishes evidence from opinion'). Script computes epistemic_share =
          epistemic micro-skills / (procedural + epistemic) per grade.
        evidence_ids:
        - rvr-pisa-epistemic-knowledge
        - progression-ngss-argument-from-evidence
        - progression-kuhn-theory-evidence
        - progression-kuhn-dean-focus-single-factor
        suggested_threshold: '>= 1 epistemic micro-skill per inquiry strand per grade from grade 3; epistemic_share
          >= 25% by grade 5-6'
        caveats: Kuhn shows young children 'think with their theories rather than about them'; epistemic
          targets in grades 2-3 should be limited to concrete distinctions (opinion vs evidence, determinate
          vs indeterminate test) rather than abstract nature-of-science statements.
      - criterion: Grade-band alignment of inquiry micro-skills with NGSS Appendix F and empirical CVS
          evidence
        operationalisation: 'Map each inquiry micro-skill to an NGSS practice element and grade band (K-2,
          3-5, 6-8). Script flags (a) ''control variables / fair test with variables controlled and trials
          considered'' assigned before grade 3 (Chen & Klahr: learnable from grade 2-4 only with explicit
          instruction), (b) ''identify independent/dependent variables and controls'' or ''correlation
          vs causation'' assigned before grade 6, (c) any grade 3-6 sequence in which an investigation
          micro-skill precedes the conceptual micro-skills it depends on (Ofsted: enquiry without prior
          knowledge is discovery learning).'
        evidence_ids:
        - progression-ngss-planning-investigations
        - progression-ngss-asking-questions
        - progression-ngss-analyzing-data
        - progression-cvs-chen-klahr-1999
        - progression-cvs-klahr-nigam-2004
        - progression-cvs-strand-cary-klahr-2008
        - progression-koerber-inventory-grades-2-4
        - cls-ofsted-sequencing-and-chunking
        - progression-nrc-framework-trajectory-caveat
        suggested_threshold: 0 hard violations of (a) and (b); 100% of investigation micro-skills have
          at least one prerequisite content micro-skill earlier in the same year
        caveats: NRC itself notes the practice progressions rest on committee judgment with little developmental
          evidence; within-age variability is large, so bands are floors for expectation, not ceilings.
      - criterion: Explicit-then-fade guidance ratio for new inquiry procedures
        operationalisation: For each new procedural micro-skill (e.g., CVS, data table, bar graph), tag
          its first occurrence as guidance_mode in {worked_example/direct, guided_practice, independent_inquiry}.
          Script checks that the first occurrence is worked_example/direct or guided_practice, that at
          least one later occurrence in the same year is independent_inquiry, and computes the share of
          inquiry minutes that are teacher-led vs student-led.
        evidence_ids:
        - cls-kirschner-sweller-clark-guidance
        - cls-hmelo-silver-scaffolded-inquiry
        - cls-alfieri-enhanced-discovery
        - cls-furtak-teacher-led-inquiry
        - cls-lazonder-harmsen-guidance
        - progression-cvs-klahr-nigam-2004
        suggested_threshold: 100% of new procedures introduced with explicit/worked-example or guided
          mode; >= 50% of inquiry minutes teacher-guided in grades 2-4
        caveats: Evidence is largely from grades 3-6 and CVS; Lazonder & Harmsen could not resolve age
          moderation. Enhanced discovery (with feedback, scaffolds, elicited explanations) outperforms
          other instruction, so the target is guided inquiry, not elimination of inquiry.
      - criterion: 'Spacing and retrieval: number of spaced revisits and retrieval events per core concept
          per year'
        operationalisation: For each core concept (e.g., states of water, fair test) count distinct weeks
          in which it appears (revisits) and the number of tasks tagged retrieval_practice (low-stakes
          recall/prediction before re-teaching). Script reports concepts with revisits < 2 or retrieval
          events = 0, and the mean gap in weeks between revisits.
        evidence_ids:
        - cls-spacing-science-concepts-5-7
        - cls-retrieval-practice-fourth-grade
        - cls-hattie-effect-sizes
        suggested_threshold: '>= 2 spaced revisits (>= 2 weeks apart) and >= 2 retrieval events per core
          concept per year'
        caveats: Spacing evidence in science concepts comes from 5-7-year-olds (n = 36); retrieval evidence
          at grade 4 used word lists, not science reasoning. Thresholds are pragmatic, not derived.
      - criterion: 'Misconception coverage: proportion of misconception-prone core ideas with an explicit
          conceptual-change element'
        operationalisation: Maintain a misconception registry keyed by domain (from the misconception-*
          findings). For each core idea linked to a registered misconception, check whether the unit contains
          at least one task tagged conceptual_change in {refutation_text, predict_observe_explain, discrepant_event,
          bridging_analogy, model_revision} that names the misconception. Script computes coverage = covered
          ideas / misconception-prone ideas per grade.
        evidence_ids:
        - conceptual-change-refutation-text-meta
        - conceptual-change-refutation-text-review
        - conceptual-change-conflict-common-element
        - conceptual-change-bridging-analogies
        - misconceptions-suppressed-not-erased
        - misconception-plants-eat-soil
        - misconception-earth-shape-synthetic-models
        - misconception-day-night-sun-hides
        - misconception-heat-temperature-substance
        - misconception-electricity-clashing-currents
        - misconception-living-things-movement-criterion
        - misconception-water-cycle-evaporation
        - misconception-adaptation-teleological
        suggested_threshold: '>= 80% of misconception-prone core ideas have an explicit conceptual-change
          task; 100% for the ten best-documented misconceptions'
        caveats: Refutation-text effect (g = 0.41) is averaged across ages; Tippett found no developmental
          moderation but most studies are secondary/tertiary. Misconceptions are suppressed, not erased,
          so a single task is unlikely to suffice; revisit is needed (see spacing criterion).
      - criterion: Argumentation (CER) presence by grade band
        operationalisation: 'Tag tasks with argument_component in {claim, evidence, reasoning, rebuttal,
          critique_peer}. Script checks: grades 2-3 include claim+evidence and ''opinion vs evidence''
          tasks; grades 4-5 add reasoning, critique of peers'' explanations and ''fact vs reasoned judgment
          vs speculation''; grade 6 adds rebuttal and comparing two arguments. Compute per-grade counts
          of tasks with >= 2 components.'
        evidence_ids:
        - progression-ngss-argument-from-evidence
        - progression-cer-mcneill-krajcik
        - rvr-chi-icap
        - progression-lehrer-schauble-data-modeling
        suggested_threshold: '>= 1 multi-component argument task per unit from grade 3; rebuttal present
          in >= 1 unit per year from grade 5'
        caveats: CER evidence is from grades 5-8; extension to grades 2-4 relies on NGSS K-2/3-5 elements
          which are judgment-based. Constructive/interactive (ICAP) coding of tasks can be a proxy for
          argument quality but is not validated for young children.
      - criterion: Reasoning-programme effect expectation for evaluation design
        operationalisation: 'When piloting a reasoning-heavy sequence, pre-register expected effect sizes:
          small on general attainment (P4C ES 0.10-0.12; null at scale) and moderate-to-large on reasoning
          measures when the programme embeds cognitive conflict, metacognition and bridging within science
          content (CASE 0.67-1.26 SD on Piagetian tests at ages 11-14; Year 1 cognitive acceleration ES
          0.43-0.47). Use a scientific-thinking inventory of the Koerber type (grades 2-4) as the primary
          outcome rather than generic attainment.'
        evidence_ids:
        - rvr-p4c-eef-efficacy-trial
        - rvr-p4c-eef-effectiveness-trial-null
        - rvr-case-shayer-1999-effects
        - rvr-cognitive-acceleration-primary-ref
        - progression-koerber-inventory-grades-2-4
        - rvr-gotwals-songer-fused-items
        suggested_threshold: null
        caveats: CASE effects come from UK secondary schools in the 1980s-90s with the developers involved;
          P4C at scale showed no attainment effect. Effects on reasoning tests do not automatically transfer
          to content knowledge, and single items misplace students across contexts (Alonzo & Steedle;
          Gotwals & Songer).
