    knowledge_structure:
      findings:
      - id: kst-learning-space-axioms
        topic: candidate_f_hybrid
        claim: Knowledge Space Theory defines a learning space by two axioms (learning smoothness, learning
          consistency) and shows learning spaces are exactly antimatroids, a strictly richer structure
          than a prerequisite DAG.
        detail: Falmagne, Doignon, Cosyn and Thiéry formalise a knowledge structure as a family of feasible
          knowledge states (subsets of items). A learning space additionally satisfies [L1] any state
          included in a larger state can be reached by mastering items one at a time and [L2] knowing
          more does not prevent learning something new. A finite, downgradable, union-closed structure
          is an antimatroid. Ordinal spaces (closed under intersection too) correspond one-to-one to quasi-orders
          by Birkhoff's theorem, which is the DAG special case; general learning spaces are not representable
          by a single DAG.
        quote: '[L2] Learning consistency. For any two states K, L with K ⊂ L, if q is an item such that
          K ∪ {q} is a state, then L ∪ {q} is also a state.'
        source_title: Knowledge Spaces and Learning Spaces, J.-C. Falmagne, J.-P. Doignon, E. Cosyn, N.
          Thiéry, arXiv 1511.06757, 2015
        source_url: https://arxiv.org/pdf/1511.06757
        retrieved_at: '2026-09-13'
        confidence: high
      - id: kst-surmise-function-clauses
        topic: candidate_f_hybrid
        claim: In KST the AND of prerequisites is a clause (a set of items) and OR is expressed by giving
          an item several alternative clauses; the surmise function maps each item to its set of clauses
          and is in one-to-one correspondence with granular knowledge spaces.
        detail: 'Definition 17 of the paper: a surmise function sigma maps each item q to a nonempty collection
          sigma(q) of subsets of Q; each C in sigma(q) is a clause for q. A state K is feasible iff for
          every q in K some clause of q is contained in K. Thus one clause = conjunction of prerequisites,
          several clauses = disjunction of alternative prerequisite sets. Theorem 19 shows a space is
          a learning space iff every clause is a clause for only one item. This is exactly the AND/OR
          prerequisite semantics, so a hypergraph/AND-OR representation is the formal core of ALEKS-style
          structures, not an exotic add-on.'
        quote: 'K ∈ K ⟺ ∀q ∈ K, ∃C ∈ σ(q) : C ⊆ K.'
        source_title: Knowledge Spaces and Learning Spaces, J.-C. Falmagne, J.-P. Doignon, E. Cosyn, N.
          Thiéry, arXiv 1511.06757, 2015
        source_url: https://arxiv.org/pdf/1511.06757
        retrieved_at: '2026-09-13'
        confidence: high
      - id: kst-query-routine-expert-reliability
        topic: evidence_reliability
        claim: ALEKS builds its structure with the QUERY routine; experts answer single-item precedence
          questions reliably but their answers to multi-item (Block 2+) queries are less reliable and
          are instead inferred from very large assessment datasets.
        detail: 'The QUERY routine (Koppen 1993, Müller 1989) asks whether failing all items in a set
          A practically guarantees failing item q. Block 1 queries (|A|=1) yield a quasi-order and, via
          Birkhoff, an ordinal space that ''typically contains a possibly very large number of false states''.
          The authors state that expert responses to higher-block queries are less reliable, so Block
          2 relations {r,t}Pq are estimated from conditional probabilities P(q=0 | r=t=0) exceeding a
          threshold, which requires ''a very large collection of assessment data''. Consequence for a
          design-time project with no learner data: only the DAG part (Block 1) is obtainable from experts;
          the OR/alternative-clause part of KST is essentially data-dependent.'
        quote: While human experts are capable of providing useful responses to queries of the type [Q1],
          their responses to queries of higher blocks are less reliable.
        source_title: Knowledge Spaces and Learning Spaces, J.-C. Falmagne, J.-P. Doignon, E. Cosyn, N.
          Thiéry, arXiv 1511.06757, 2015
        source_url: https://arxiv.org/pdf/1511.06757
        retrieved_at: '2026-09-13'
        confidence: high
      - id: aleks-expert-then-data-maintenance
        topic: candidate_f_hybrid
        claim: ALEKS' practical method requires an expert to answer a few thousand queries for a first-draft
          structure, then several thousand students per year of data to prune rare states and validate
          the structure; a Beginning Algebra structure reaches predicted-vs-observed correlations of only
          .7-.8.
        detail: 'Falmagne et al. describe that experts (seasoned teachers, textbook writers) produce the
          first draft via Q1/Q2 questions; a High School Algebra structure has several hundred thousand
          feasible states. Expert consensus ''alone does not guarantee the validity of the knowledge structure''.
          Student data are used to delete states occurring rarely and to monitor validity by an extra
          probe item. This is the maintenance cost of KST: every change to the item set implies re-querying
          and re-validating a state space that is combinatorial in size, and validity monitoring is impossible
          without a live assessment stream.'
        quote: For typical knowledge structures encountered in education, an expert may be required to
          respond to a few thousand questions to get a complete description of all the knowledge states.
        source_title: The Assessment of Knowledge, in Theory and in Practice, J.-C. Falmagne, E. Cosyn,
          J.-P. Doignon, N. Thiéry, 2006 (ALEKS Corp. reprint)
        source_url: https://www.aleks.com/about_aleks/Science_Behind_ALEKS.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: aleks-data-scale-2021
        topic: candidate_f_hybrid
        claim: The 2021 ALEKS data paper confirms that the system's knowledge structures are guided jointly
          by theory and by insights learned from data of millions of students, underscoring that KST at
          scale is a data-hungry, continuously calibrated structure.
        detail: Cosyn, Uzun, Doble and Matayoshi (Journal of Mathematical Psychology 2021) survey ALEKS
          as an instantiation of KST 'used by millions of students' and state that in assessment, learning
          mode and re-assessment 'the interactions of the student with the system are guided by the theory
          and by insights learned from student data'. Only the abstract was accessible (paywalled).
        quote: the interactions of the student with the system are guided by the theory and by insights
          learned from student data.
        source_title: 'A practical perspective on knowledge space theory: ALEKS and its data, E. Cosyn,
          H. Uzun, C. W. Doble, J. Matayoshi, 2021'
        source_url: https://api.semanticscholar.org/graph/v1/paper/DOI:10.1016/j.jmp.2021.102512?fields=title,abstract,year,authors
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: poks-dag-approximation-drops-or
        topic: candidate_c_probabilistic
        claim: Desmarais' POKS deliberately assumes closure under both union and intersection so the structure
          becomes a DAG, explicitly giving up the representation of alternative (OR) prerequisites; POKS
          is learned from as few as 30-100 test cases but only over observable items.
        detail: Desmarais, Meshkinfam and Gagnon explain that a union-closed knowledge space 'can be represented
          by an AND/OR graph' but that alternative prerequisites break intersection-closure; POKS ignores
          this and uses a DAG over items. The learned structures were trained on 100, 30 and 30 cases
          for 20, 33 and 30 items respectively. The paper also argues that graphical student models with
          hidden skill nodes are 'seldom completely learned from data' and rely on human expertise, and
          that dependence on both domain and probabilistic-modelling experts is a practical bottleneck.
          For a curriculum project with zero learner data, neither POKS nor a BN over latent skills can
          be calibrated.
        quote: we make the assumption/approximation that knowledge spaces are closed under union and intersection
          and ignore the possibility of representing alternate prerequisite knowledge items.
        source_title: Learned Student Models with Item to Item Knowledge Structures, M. C. Desmarais,
          P. Meshkinfam, M. Gagnon, User Modeling and User-Adapted Interaction, 2006
        source_url: http://www.professeurs.polymtl.ca/michel.desmarais/Publications-Michel/jumuai.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: bkt-corbett-anderson-needs-fit
        topic: candidate_c_probabilistic
        claim: Bayesian Knowledge Tracing (Corbett & Anderson 1995) is a per-skill hidden Markov model
          whose parameters are fitted to student performance data; running systems typically drop the
          individual-difference parameters, and the approach scales poorly to domains with many skills.
        detail: Pavlik, Brawner, Olney and Mitrovic's review describes BKT as 'the core Markov model knowledge
          tracing formalism' introduced by Corbett & Anderson (1995) with detailed modelling of individual
          differences, notes that many deployed systems 'do not realize the full complexity' of the original
          models, and flags that a primary weakness of this approach is domains with many skills or misconceptions.
          BKT parameters (initial knowledge, learning, guess, slip) exist only after fitting to interaction
          logs. The original 1995 paper is paywalled at Springer; details here come from the secondary
          review.
        quote: many of the running systems do not realize the full complexity of Corbett's original models
          of individual differences (Corbett & Anderson, 1995).
        source_title: A Review of Student Models Used in Intelligent Tutoring Systems, P. I. Pavlik Jr.,
          K. Brawner, A. Olney, A. Mitrovic, 2013
        source_url: https://www.stat.cmu.edu/~brian/nynke/726-2021/project%20HCI%20Prereqs%20(Elaine,%20Smeet%20&%20Zhou)/articles/pavlik_studentmodels_2013.pdf
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: ecd-dbn-data-requirement
        topic: candidate_c_probabilistic
        claim: An ECD plus dynamic Bayesian network model of a learning progression required 1,450 students
          on two occasions to estimate conditional probability tables with EM; the structure can be posited
          before data, but the probabilities cannot.
        detail: The Frontiers in Psychology 2022 study links Mislevy's Evidence-Centered Design (construct,
          evidence, task, assembly, presentation models) to a DBN whose latent nodes are learning-progression
          levels. CPTs were estimated in Netica with EM from 1,450 students and 26 tasks across four LP
          levels. The authors note the first-order Markov assumption, single-LP scope and that 'many decisions
          that must be made when designing a BN' require iteration with content experts. This is the concrete
          data bill for candidate C when applied to learning progressions.
        quote: determined from data, the structure can be posited before data are collected.
        source_title: Evidence centered design framework and dynamic bayesian network for modeling learning
          progression in online assessment system, Frontiers in Psychology, 2022
        source_url: https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2022.742956/full
        retrieved_at: '2026-09-13'
        confidence: high
      - id: ahm-adjacency-reachability-qr
        topic: candidate_d_qmatrix
        claim: The Attribute Hierarchy Method represents prerequisite structure among attributes as a
          binary adjacency matrix whose transitive closure (reachability matrix) constrains the Q-matrix
          to a reduced Qr blueprint, i.e., a DAG over attributes is the standard substrate of hierarchical
          cognitive diagnosis.
        detail: 'Gierl, Wang and Zhou describe Stage 1 of AHM: the direct relationships among k attributes
          are an upper-triangular adjacency matrix A; R = (A+I)^n gives direct and indirect relations;
          the potential item pool of 2^k - 1 attribute combinations is reduced by Boolean inclusion against
          R to the reduced incidence matrix Qr, which ''represents the cognitive specifications or blueprint''
          for the test. The expert-built hierarchy is then evaluated against response data via the Hierarchy
          Consistency Index. The method presupposes items written to every permitted attribute combination
          and student response data; both are absent at curriculum-design time.'
        quote: The direct relationship among attributes is specified by a binary adjacency matrix (A)
          of order (k,k), where k is the number of attributes. The adjacency matrix is of upper triangular
          form.
        source_title: Using the Attribute Hierarchy Method to Make Diagnostic Inferences about Examinees'
          Cognitive Skills in Algebra on the SAT, M. J. Gierl, C. Wang, J. Zhou, JTLA 6(6), 2008
        source_url: https://files.eric.ed.gov/fulltext/EJ838616.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: ahm-hierarchy-forms-hci
        topic: candidate_d_qmatrix
        claim: AHM distinguishes linear, convergent, divergent and unstructured attribute hierarchies
          and validates an expert hierarchy against data with a Hierarchy Consistency Index, with values
          above 0.70 taken as good model-data fit.
        detail: The encyclopaedic summary of Leighton, Gierl and Hunka's method lists four canonical hierarchy
          forms that 'can easily be expanded and combined to form increasingly complex networks', and
          the HCI ranging from -1 to +1 as the fit statistic. Convergent hierarchies (several attributes
          required for one) are the AND case; AHM has no native OR construct, and OR must be simulated
          by duplicating attributes.
        quote: evaluates the degree to which the observed response patterns are consistent with the attribute
          hierarchy
        source_title: Attribute hierarchy method, Wikipedia (summarising Leighton, Gierl & Hunka 2004),
          retrieved 2026
        source_url: https://en.wikipedia.org/wiki/Attribute_hierarchy_method
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: hdcm-attribute-hierarchy-standard
        topic: candidate_d_qmatrix
        claim: 'Templin and Bradshaw''s Hierarchical Diagnostic Classification Model formalises attribute
          hierarchies in CDMs: a hierarchy removes attribute profiles inconsistent with the prerequisite
          order and can be tested statistically, confirming DAGs over attributes as mainstream in cognitive
          diagnosis.'
        detail: The Psychometrika 2014 paper states that hierarchically structured latent attributes are
          'anticipated in many areas of educational and psychological assessment' yet ordinary DCMs cannot
          evaluate them. HDCM restricts the latent class space so that a learner cannot master a higher
          attribute without the prerequisite ones, and simulation and empirical results show it can 'accurately
          test for the presence of an attribute hierarchy statistically'. Testing the hierarchy requires
          response data; without data the hierarchy is purely a design assumption.
        quote: current psychometric models are limited in their capacity to objectively evaluate the presence
          of such attribute hierarchies.
        source_title: 'Hierarchical Diagnostic Classification Models: A Family of Models for Estimating
          and Testing Attribute Hierarchies, J. Templin, L. Bradshaw, Psychometrika, 2014'
        source_url: https://www.cambridge.org/core/product/51E19BDAD5D3DA643F9BC1005F311C5E/core-reader
        retrieved_at: '2026-09-13'
        confidence: high
      - id: qmatrix-misspecification-fragility
        topic: candidate_d_qmatrix
        claim: Flipping a single Q-matrix entry per item in a DINA model produces item-specific overestimation
          of slip or guess parameters and high misclassification rates for affected attribute classes,
          demonstrating the fragility of Q-matrices under maintenance edits.
        detail: Rupp and Templin (Educational and Psychological Measurement 2008) misspecified a 4-attribute,
          15-pattern Q-matrix by changing one 0 or 1 per item so that some attribute combinations were
          deleted and incorrect dependencies were introduced. Deleting attributes inflated slipping parameters,
          adding attributes inflated guessing parameters, and classes containing deleted combinations
          were misclassified at high rates. For a curriculum graph that will be edited by teachers, this
          means every Q-matrix change requires re-estimation and re-validation against data, which is
          impossible without learner responses.
        quote: high misclassification rates for attribute classes that contained attribute combinations
          that were deleted from the Q-matrix.
        source_title: The Effects of Q-Matrix Misspecification on Parameter Estimates and Classification
          Accuracy in the DINA Model, A. A. Rupp, J. Templin, 2008
        source_url: https://eric.ed.gov/?id=EJ782123
        retrieved_at: '2026-09-13'
        confidence: high
      - id: gdina-framework
        topic: candidate_d_qmatrix
        claim: G-DINA generalises DINA/DINO and estimates item-level models from response data using design
          and weight matrices and Wald tests; it is an assessment scoring framework, not a curriculum-sequencing
          structure.
        detail: de la Torre (Psychometrika 2011) frames G-DINA as a general CDM in which DINA, DINO and
          others are constrained special cases, with item-by-item estimation and model comparison. The
          Q-matrix maps items to attributes; it contains no time, grade or ordering information and every
          parameter requires examinee data. Abstract only (paywalled).
        quote: a generalization of the DINA model with more relaxed assumptions.
        source_title: The Generalized DINA Model Framework, J. de la Torre, Psychometrika 76(2), 2011
        source_url: https://eric.ed.gov/?id=EJ921258
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: tatsuoka-rule-space-origin
        topic: candidate_d_qmatrix
        claim: Tatsuoka's 1983 rule space introduced the item-by-attribute incidence (Q) matrix as an
          IRT-based way of classifying response patterns into erroneous rules, i.e., a diagnostic scoring
          device rather than a curriculum ordering.
        detail: The ERIC record describes rule space as a method that can 'represent large numbers of
          erroneous rules of arithmetic operations quantitatively and can predict the likelihood of each
          erroneous rule'. The lineage to DINA/AHM is direct; the purpose throughout is diagnosis from
          responses. Abstract only.
        quote: represent large numbers of erroneous rules of arithmetic operations quantitatively and
          can predict the likelihood of each erroneous rule.
        source_title: 'Rule Space: An Approach for Dealing with Misconceptions Based on Item Response
          Theory, K. K. Tatsuoka, Journal of Educational Measurement 20(4), 1983'
        source_url: https://eric.ed.gov/?id=EJ296184
        retrieved_at: '2026-09-13'
        confidence: medium
      - id: andor-feasibility-linear-time
        topic: sequencing_complexity
        claim: For AND/OR precedence constraints, feasibility and transitivity questions are decidable
          by essentially one linear-time algorithm and earliest start times are computable in polynomial
          time, so an AND/OR curriculum graph remains cheap to check even though it is not a DAG.
        detail: Möhring, Skutella and Stork (SIAM J. Comput. 33(2), 2004) generalise precedence constraints
          to pairs (X, j) meaning job j needs some job in X finished. They show feasibility and many transitivity
          questions reduce to a Horn-SAT-like problem solvable in linear time, and give two polynomial-time
          algorithms for earliest start times under different time-distance classes; a further generalisation
          (waiting conditions) becomes NP-complete. For counterfactual queries such as 'move skill X to
          grade 3', this means violated AND/OR prerequisites can be recomputed instantly.
        quote: We show that feasibility as well as many questions related to transitivity can be solved
          by applying essentially the same linear-time algorithm.
        source_title: Scheduling with AND/OR Precedence Constraints, R. H. Möhring, M. Skutella, F. Stork,
          SIAM Journal on Computing 33(2), 2004
        source_url: https://page.math.tu-berlin.de/~skutella/andor.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: andor-scheduling-hardness
        topic: sequencing_complexity
        claim: Scheduling unit jobs under mixed AND/OR constraints is NP-hard even in very restricted
          settings, whereas pure AND or pure OR constraints admit polynomial algorithms on two machines;
          the OR component is what raises optimisation difficulty.
        detail: 'The IPEC 2025 paper defines generalised precedence constraints as Boolean formulas over
          jobs (AND = conjunction, OR = disjunction, AND/OR = CNF) and reports that conjunctive and disjunctive
          constraints are polynomial on two machines (Coffman & Graham 1972; Johannes 2005) while mixed
          AND/OR constraints are NP-hard even with a single successor, citing Möhring, Skutella & Stork
          and Gillies & Liu as foundational. Practical implication: keep OR-groups rare and small so the
          CP-SAT model stays close to the tractable AND case.'
        quote: and/or-constraints if every formula is in conjunctive normal form.
        source_title: Parameterized Complexity of Scheduling Unit-Time Jobs with Generalized Precedence
          Constraints, LIPIcs IPEC 2025
        source_url: https://drops.dagstuhl.de/entities/document/10.4230/LIPIcs.IPEC.2025.7
        retrieved_at: '2026-09-13'
        confidence: high
      - id: precedence-knapsack-np-hard
        topic: sequencing_complexity
        claim: Selecting a prerequisite-closed subset of skills that fits a time budget is the partially
          ordered knapsack problem, strongly NP-complete even for bipartite orders, with an FPTAS only
          for special orders such as out-trees (Johnson & Niemi 1983) and 2-dimensional orders.
        detail: 'Kolliopoulos and Steiner define POK: find an order ideal (precedence-closed prefix) of
          a poset maximising weight subject to a capacity. They recall that POK ''is strongly NP-complete,
          even when p_i = w_i and the partial order is bipartite'' and hence has no FPTAS unless P=NP;
          Johnson and Niemi gave an FPTAS for directed out-trees; Hajiaghayi et al. proved strong inapproximability.
          This is exactly the ''which skills fit in 160 h for grade g'' problem, so exact solving must
          rely on CP-SAT/ILP rather than greedy topological sort plus knapsack heuristics.'
        quote: POK is strongly NP-complete, even when p_i = w_i, i ∈ N, and the partial order is bipartite
        source_title: Partially-Ordered Knapsack and Applications to Scheduling, S. G. Kolliopoulos, G.
          Steiner, 2002/2007
        source_url: https://cgi.di.uoa.gr/~sgk/papers/pok-web-version.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: precedence-structure-complexity-survey
        topic: sequencing_complexity
        claim: 'The structure of precedence constraints largely decides complexity class: many scheduling
          problems NP-hard under general precedence become polynomial for chains, trees or other restricted
          orders.'
        detail: 'Prot and Bellenguez-Morineau''s survey (Journal of Scheduling 2018, arXiv 2015) systematically
          maps which precedence-graph shapes flip problems between NP-hard and polynomial. For curriculum
          graphs this is a reason to keep the prerequisite relation sparse and near-tree-like: it lowers
          solver effort and improves auditability. The classical Lenstra & Rinnooy Kan (1978) NP-hardness
          results were paywalled; the survey is used as the accessible proxy.'
        quote: the structure of precedence constraints plays a tremendous role on the complexity of scheduling
          problems.
        source_title: How the structure of precedence constraints may change the complexity class of scheduling
          problems, D. Prot, O. Bellenguez-Morineau, arXiv 1510.04833 / Journal of Scheduling 2018
        source_url: https://arxiv.org/abs/1510.04833
        retrieved_at: '2026-09-13'
        confidence: high
      - id: cpsat-optional-intervals-precedence
        topic: sequencing_complexity
        claim: OR-Tools CP-SAT natively supports optional interval variables with presence literals and
          reified precedence inequalities, which is the natural encoding of 'skill may or may not be scheduled
          in this grade, and if both are, prerequisite ends before dependent starts'.
        detail: The official scheduling recipes document intervals as start/size/end affine expressions,
          optional intervals whose presence is controlled by a literal, and note that temporal relations
          are linear inequalities on start/end that 'must be reified by the presence literals' when intervals
          are optional. Cumulative and no-overlap constraints ignore absent intervals. A per-grade 160
          h budget becomes a cumulative/linear capacity; AND-groups are conjunctions of reified precedences;
          OR-groups are Boolean OR over presence literals of alternative prerequisites. The document gives
          no benchmark for n≈500, so tractability at that size is an engineering expectation, not a cited
          result.
        quote: If one or both intervals are optional, then these inequalities must be reified by the presence
          literals.
        source_title: OR-Tools CP-SAT scheduling recipes (scheduling.md), Google, stable branch
        source_url: https://raw.githubusercontent.com/google/or-tools/stable/ortools/sat/docs/scheduling.md
        retrieved_at: '2026-09-13'
        confidence: high
      - id: expert-prereq-agreement-kappa
        topic: evidence_reliability
        claim: Three domain-expert annotators labelling concept prerequisite pairs in MOOCs reached only
          moderate inter-annotator agreement (pairwise kappa 0.59-0.65), showing that even simple pairwise
          prerequisite judgments are noisy.
        detail: 'Pan, Li, Li and Tang (ACL 2017) built ground truth by having three annotators majoring
          in each domain label 25% of all concept pairs as a-before-b, b-before-a or none, taking majority
          vote; Table 1 reports kappa = 0.63 (Machine Learning, 244 concepts), 0.65 (Data Structures,
          201 concepts) and 0.59 (Calculus, 128 concepts). Automatic inference achieved F1 in the 60s-70s.
          Implication: an expert-built map for grades 2-6 should record provenance and confidence per
          edge and expect roughly one third of pairwise judgments to be contestable.'
        quote: three human annotators majoring in the corresponding domain were asked to label them as
          'a is b's prerequisite', 'b is a's prerequisite' or 'no prerequisite relationship'
        source_title: Prerequisite Relation Learning for Concepts in MOOCs, L. Pan, C. Li, J. Li, J. Tang,
          ACL 2017
        source_url: https://keg.cs.tsinghua.edu.cn/jietang/publications/ACL17-Pan-et-al-Prerequisite-Relationship-MOOCs.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: label-scarcity-active-learning
        topic: evidence_reliability
        claim: The lack of large-scale prerequisite labels is a major obstacle to data-driven prerequisite
          learning; textbook-derived concept maps had to be checked by experts for strict partial-order
          properties (transitivity, irreflexivity) before use.
        detail: Liang, Ye, Wang, Pursel and Giles (AAAI 2018) state that 'a major obstacle to extracting
          prerequisites at scale is the lack of large scale labels'. They used four textbook domains (89-224
          concepts, 292-699 prerequisite pairs), validated each dataset for partial-order properties and
          asked domain experts to correct labels, then expanded by transitivity. This supports enforcing
          acyclicity and transitive-consistency checks as a maintenance invariant of any expert-built
          map.
        quote: A major obstacle to extracting prerequisites at scale is the lack of large scale labels
          which will enable effective data driven solutions.
        source_title: Investigating Active Learning for Concept Prerequisite Learning, C. Liang, J. Ye,
          S. Wang, B. Pursel, C. L. Giles, AAAI 2018
        source_url: https://clgiles.ist.psu.edu/pubs/eaai18.pdf
        retrieved_at: '2026-09-13'
        confidence: high
      - id: carnegie-expert-vs-data-prereqs
        topic: evidence_reliability
        claim: On 20,577 Cognitive Tutor students across 888 schools, data-derived unit prerequisites
          agreed with Carnegie Learning's expert/skill-model list on only 56% of pairs overall and on
          14% of positive prerequisite pairs; about 43% of all tested prior units showed a significant
          prerequisite effect.
        detail: Vuong, Nixon and Towle (EDM 2011) tested 3,832 (Unit A, Unit B) pairs across four curricula
          (175 units) with a binomial test (alpha 0.01) on first-section graduation rates for students
          who did versus did not see Unit A. They found on average 9.6 true prerequisites out of 21.2
          candidates per unit. The paper notes 'Expert judgment is more suspect when it has identified
          a prerequisite that is not borne out by the data'. This is the strongest large-scale evidence
          that expert prerequisite maps contain many spurious links, and it was possible only with massive
          longitudinal data.
        quote: Overall, there was 56% agreement between the two methods (percentage of green blocks) and
          14% agreement on true prerequisites (percentage of dark green blocks).
        source_title: A Method for Finding Prerequisites Within a Curriculum, A. Vuong, T. Nixon, B. Towle,
